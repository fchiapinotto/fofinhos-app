<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nossos Fofinhos mudou de casa</title>
<style>
  :root { color-scheme: light dark; --fundo:#f5f3ee; --texto:#2b2b2b; --suave:#6b6b6b; --verde:#4a5d3a; }
  @media (prefers-color-scheme: dark) { :root { --fundo:#1d1d1b; --texto:#eeeae2; --suave:#a8a49b; --verde:#9cb386; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--fundo); color:var(--texto);
         font:16px/1.5 -apple-system, system-ui, sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:420px; text-align:center; }
  img { width:84px; height:84px; border-radius:20px; }
  h1 { font-size:22px; margin:18px 0 8px; }
  p { color:var(--suave); margin:0 0 10px; }
  b { color:var(--verde); }
</style>
</head>
<body>
<main>
  <img src="icon-180.png" alt="">
  <h1>O Fofinhos mudou de casa</h1>
  <p>O app agora roda no Mac mini da família e abre pela rede da casa.</p>
  <p><b>Apague este ícone</b> e adicione o endereço novo à Tela de Início.</p>
</main>
<script>
  // tira o app antigo do aparelho (cache e service worker)
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
</script>
</body>
</html>
