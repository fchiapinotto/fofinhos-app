<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossos Fofinhos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fofinhos">
<meta name="theme-color" content="#f28c1e">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--verde:#4a6b3a;--verde-d:#33502a;--verde-cl:#e9f0e4;--rosa:#b03a55;--rosa-cl:#fbe8ed;--azul:#2f5da3;--azul-cl:#e9f0fa;--ambar:#8a6508;--ambar-cl:#f8f1dc;--roxo:#6b4fa0;--roxo-cl:#ece7f7;
    --ink:#1b2330;--ink2:#4f5663;--ink3:#686e7b;--bg:#f5f4f0;--card:#fff;--line:#e8e6e0;--r:16px;--rl:20px;--hero-img:none;
    --c-jorge:#b5652a;--c-jorge-cl:#f8ebe0;--c-stout:#2f4858;--c-stout-cl:#e4ebef;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--verde);outline-offset:2px}
  header{position:sticky;top:0;z-index:20;background:rgba(245,244,240,.88);backdrop-filter:blur(12px);padding:calc(8px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:6px}
  @media (max-width:400px){.h-title .hl{display:none}}
  .h-acts{display:flex;align-items:center;gap:2px;flex-shrink:0}
  .ibtn{width:40px;height:44px;border:none;background:none;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);font-size:21px;flex-shrink:0}.ibtn.v{color:var(--verde)}
  .h-title{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .seg{display:flex;background:#e9e7e1;border-radius:12px;padding:3px}
  .seg div{display:flex;align-items:center;gap:6px;min-height:38px;padding:4px 10px 4px 6px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
  .seg div img{width:22px;height:22px;border-radius:50%;object-fit:cover}
  .seg div.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .seg div.on.j{color:var(--c-jorge)}.seg div.on.s{color:var(--c-stout)}
  main{padding:6px max(16px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left))}
  .sec{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.7px;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
  .sec span{text-transform:none;letter-spacing:0;font-weight:600;color:var(--verde);font-size:12.5px;cursor:pointer;padding:12px 0 12px 14px;margin:-12px 0;white-space:nowrap;flex-shrink:0}
  .t-mut{font-size:13px;color:var(--ink2)}
  .empty{text-align:center;color:var(--ink2);font-size:14px;padding:26px 12px;line-height:1.55}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
  .empty .btn{width:auto;margin-top:14px;padding:11px 18px}
  .vazio{font-size:13px;color:var(--ink2);margin:0 2px 8px}
  .hero{border-radius:var(--rl);padding:210px 18px 16px;margin:8px 0 4px;color:#fff;background:linear-gradient(180deg,rgba(20,35,18,0) 0%,rgba(20,35,18,.25) 50%,rgba(20,35,18,.85) 100%),var(--hero-img) center 30%/cover;text-shadow:0 1px 8px rgba(0,0,0,.45)}
  .hero.nofoto{padding-top:18px;background:linear-gradient(150deg,#4f7440,#2f4a28)}
  .hero .hn{font-size:26px;font-weight:700;letter-spacing:-.4px}.hero .hs{font-size:13.5px;opacity:.95;margin-top:2px}
  .hero .kpis{display:flex;gap:22px;margin-top:12px}.hero .kpi b{display:block;font-size:20px;font-weight:700;line-height:1.1}.hero .kpi span{font-size:11.5px;opacity:.9}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px}
  .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
  .cb{flex:1;min-width:0}.cb .tt{font-size:15px;font-weight:600;line-height:1.3}.cb .ts{font-size:12.5px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cb .tl{display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;min-width:0}.cb .tl .tt{font-size:14.5px;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}.cb .tl .tag{margin-left:0;flex-shrink:0}
  .cb .st{font-size:12.5px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cb .tl+.ts,.cb .st+.ts{font-size:12px;color:var(--ink3)}
  .card.pend{border-style:dashed}
  .cr{text-align:right;flex-shrink:0}.cr .d{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .cr .d.late{color:var(--rosa)}.cr .d.soon{color:var(--ambar)}.cr .d.ok{color:var(--verde)}
  .tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;vertical-align:1px;margin-left:5px}
  .tag.ia{background:var(--roxo-cl);color:var(--roxo)}.tag.late{background:var(--rosa-cl);color:var(--rosa)}.tag.ok{background:var(--verde-cl);color:var(--verde)}.tag.novo{background:var(--azul-cl);color:var(--azul)}.tag.b{background:#e9e7e1;color:var(--ink2)}.tag.soon{background:var(--ambar-cl);color:var(--ambar)}
  .done-btn{position:relative;min-height:34px;border:1px solid var(--verde);color:var(--verde);background:var(--verde-cl);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}.done-btn::after{content:"";position:absolute;inset:-6px -4px}.done-btn:disabled{opacity:.55}
  .mini{border:none;background:none;color:var(--ink3);font-size:20px;cursor:pointer;padding:0;min-width:40px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.mini.ok{color:var(--verde)}.mini.del{color:var(--rosa)}.mini.doc{color:var(--azul)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:13px 15px;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;width:100%;min-height:48px}.btn:disabled{opacity:.6;cursor:default}
  .btn-p{background:var(--verde);color:#fff;border-color:var(--verde)}.btn-danger{color:var(--rosa);border-color:var(--rosa-cl);background:var(--rosa-cl)}
  textarea,input,select{width:100%;font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--card);color:var(--ink)}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--verde)}
  .field{margin-bottom:12px}.field label{font-size:12.5px;color:var(--ink2);display:block;margin-bottom:5px;font-weight:500}
  .row2{display:flex;gap:10px}.row2>.field{flex:1}
  .fam{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
  .fam .fh{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
  .fam .fb{border-top:1px solid var(--line);background:#fbfaf7;padding:6px 14px 8px}
  .hrow{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}.hrow:last-child{border-bottom:none}
  .hrow .hd{font-weight:600;font-variant-numeric:tabular-nums;width:64px;flex-shrink:0}.hrow .hb{flex:1;min-width:0;color:var(--ink2)}.hrow .hb b{color:var(--ink);font-weight:600}
  .obs{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.45;white-space:pre-wrap}
  .pet{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:16px;margin-bottom:14px}
  .pet .ph{display:flex;align-items:center;gap:13px}.pet .av{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}.pet .av img{width:100%;height:100%;object-fit:cover}
  .pet h3{margin:0;font-size:20px;font-weight:700}.pet .sub{font-size:13px;color:var(--ink2)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:14px}.grid div{font-size:13.5px}.grid b{display:block;font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .chart svg{width:100%;height:120px;display:block}
  .prod{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.prod:last-child{border-bottom:none}
  .prod .pn{font-size:14px;font-weight:600}.prod .pd{font-size:12.5px;color:var(--ink2)}
  .ct{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.ct:last-child{border-bottom:none}
  .ct .cp{font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}.ct .cn{font-size:14px;font-weight:600}.ct .cs{font-size:12.5px;color:var(--ink2)}
  .ct a.call{width:44px;height:44px;border-radius:50%;background:var(--verde-cl);color:var(--verde);display:flex;align-items:center;justify-content:center;font-size:18px;text-decoration:none;flex-shrink:0}
  .up-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--verde);color:var(--verde);border-radius:14px;padding:18px;font-size:15px;font-weight:600;cursor:pointer;background:var(--verde-cl);margin:8px 0 6px}
  .note{font-size:12.5px;color:var(--ink2);background:#efeee8;border-radius:12px;padding:10px 12px;margin-bottom:14px;line-height:1.5}
  .doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:9px}
  .doc .dh{display:flex;align-items:center;gap:10px}.doc .dn{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3}
  .doc .dm{font-size:12px;color:var(--ink3);margin-top:2px}
  .lnk{color:var(--verde);font-size:13.5px;font-weight:600;cursor:pointer;background:none;border:none;padding:11px 2px;font-family:inherit}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
  nav a{flex:1;min-height:48px;text-align:center;color:var(--ink3);font-size:10.5px;font-weight:500;text-decoration:none;cursor:pointer}nav a i{display:block;font-size:22px;margin-bottom:2px}nav a.on{color:var(--verde)}
  .fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 240px + 16px));z-index:25;width:54px;height:54px;border-radius:50%;background:var(--verde);color:#fff;border:none;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 22px rgba(51,80,42,.35)}.fab:active{transform:scale(.94)}
  .sheet{position:fixed;inset:0;background:rgba(15,22,35,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}.sheet.on{display:flex}
  .sheet-in{position:relative;background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .sh-x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:none;background:none;color:var(--ink3);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet h3{margin:2px 40px 14px 0;font-size:18px;font-weight:600;line-height:1.3}
  .toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:18px;width:max-content;max-width:calc(100% - 40px);text-align:center;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
  .login{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}.login.on{display:flex}
  .login-in{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 22px;text-align:center}
  .login-in img{width:96px;height:96px;border-radius:24px;object-fit:cover;margin-bottom:10px}
  .login-in h2{margin:0 0 4px;font-size:22px}.login-in p{margin:0 0 18px;font-size:13.5px;color:var(--ink2)}
  .login-in .field{text-align:left}.login .err{color:var(--rosa);font-size:13px;margin-top:10px;min-height:18px}
  .falar{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px dashed var(--verde);border-radius:var(--r);padding:12px 14px;margin:10px 0 4px;cursor:pointer;color:var(--verde);font-weight:600;font-size:14.5px}
  .falar i{font-size:22px}.falar span{color:var(--ink2);font-weight:400;font-size:12.5px;display:block}
  .ent{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ent:last-child{border-bottom:none}.ent .et{font-size:14px;font-weight:600}.ent .es{font-size:12.5px;color:var(--ink2)}
  .ouv{display:flex;align-items:center;gap:9px;background:var(--verde-cl);color:var(--verde-d);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin:-4px 0 12px}
  .pulso{width:10px;height:10px;border-radius:50%;background:var(--verde);animation:pul 1s ease-in-out infinite;flex-shrink:0}
  @keyframes pul{0%,100%{transform:scale(.7);opacity:.45}50%{transform:scale(1.25);opacity:1}}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 9px}
  .chip{display:inline-flex;align-items:center;min-height:44px;font-family:inherit;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer}
  .chip.on{background:var(--verde);border-color:var(--verde);color:#fff}
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 4px}
  .tbtn{display:flex;align-items:center;gap:10px;min-height:56px;padding:9px 11px;border:1px solid var(--line);background:var(--card);border-radius:14px;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;line-height:1.2}
  .tbtn i{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
  .tbtn:active{background:#faf9f6}
  .perg{background:#fbfaf7;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px}
  .perg .pq{font-size:14.5px;font-weight:600;line-height:1.35}
  .mais{display:inline-flex;align-items:center;gap:6px;color:var(--verde);font-size:13.5px;font-weight:600;cursor:pointer;margin:-8px 0 6px;padding:10px 0;min-height:44px}
  .anexo{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--azul);color:var(--azul);background:var(--azul-cl);border-radius:13px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin:0 0 12px}
  #btnRefresh.spin i{animation:sp .7s linear infinite;display:inline-block}
  .upd{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;border:none;border-radius:99px;padding:10px 16px;min-height:44px;font-size:13.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18);display:none;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}.upd.on{display:inline-flex}
  .off{background:var(--ambar-cl);color:var(--ambar);font-size:12.5px;font-weight:600;text-align:center;padding:7px 12px;border-radius:10px;margin:6px 0 0;display:none}.off.on{display:block}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="h-title"><span class="hl">Nossos </span>Fofinhos</div>
    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
      <div class="seg" id="segCao" role="tablist" aria-label="Escolher o cão"></div>
      <div class="h-acts"><button class="ibtn v" type="button" onclick="sheetFalar()" aria-label="Adicionar por voz ou texto"><i class="ti ti-microphone" aria-hidden="true"></i></button>
      <button class="ibtn" type="button" id="btnRefresh" onclick="refreshApp()" aria-label="Atualizar"><i class="ti ti-refresh" aria-hidden="true" style="font-size:20px"></i></button></div>
    </div>
  </header>
  <div class="off" id="offline" role="status">Sem internet — mostrando o que já estava carregado.</div>
  <main id="view"><div class="empty">Carregando…</div></main>
</div>
<button class="fab" id="fab" type="button" onclick="fabAction()" aria-label="Adicionar">+</button>
<button class="upd" id="upd" type="button" onclick="location.reload()"><i class="ti ti-refresh" aria-hidden="true"></i>Nova versão — tocar para atualizar</button>
<nav aria-label="Abas">
  <a role="button" tabindex="0" data-go="hoje" class="on" aria-current="page" onclick="go('hoje')"><i class="ti ti-sun" aria-hidden="true"></i>Hoje</a>
  <a role="button" tabindex="0" data-go="cart" onclick="go('cart')"><i class="ti ti-vaccine" aria-hidden="true"></i>Carteirinha</a>
  <a role="button" tabindex="0" data-go="vet" onclick="go('vet')"><i class="ti ti-stethoscope" aria-hidden="true"></i>Saúde</a>
  <a role="button" tabindex="0" data-go="docs" onclick="go('docs')"><i class="ti ti-files" aria-hidden="true"></i>Documentos</a>
  <a role="button" tabindex="0" data-go="ficha" onclick="go('ficha')"><i class="ti ti-paw" aria-hidden="true"></i>Perfil</a>
</nav>
<div class="login" id="login"><div class="login-in"><img src="icon-180.png" alt=""><h2>Nossos Fofinhos</h2><p>Entre com o e-mail da família. Você recebe um código de 6 dígitos.</p>
  <div id="lg1"><div class="field"><label for="lgEmail">E-mail</label><input type="email" id="lgEmail" autocomplete="email" inputmode="email" autocapitalize="off" placeholder="seu@gmail.com" onkeydown="if(event.key==='Enter')enviarCodigo()"></div><button class="btn btn-p" id="lgBtn1" type="button" onclick="enviarCodigo()">Enviar código</button></div>
  <div id="lg2" style="display:none"><div class="field"><label for="lgCode">Código recebido por e-mail</label><input id="lgCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456" style="text-align:center;font-size:22px;letter-spacing:6px" onkeydown="if(event.key==='Enter')entrarCodigo()"></div><button class="btn btn-p" id="lgBtn2" type="button" onclick="entrarCodigo()">Entrar</button><button class="lnk" type="button" style="margin-top:6px" onclick="enviarCodigo(true)">reenviar código</button> · <button class="lnk" type="button" onclick="lgVoltar()">usar outro e-mail</button></div>
  <div class="err" id="lgErr" role="alert"></div></div></div>
<div class="sheet" id="sheet"><div class="sheet-in" id="sheetBox" role="dialog" aria-modal="true"><button class="sh-x" type="button" onclick="closeSheet()" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button><div id="sheetIn"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filein" accept="image/*,application/pdf" style="display:none" multiple aria-hidden="true" tabindex="-1">

const hojeISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dBR=iso=>{if(!iso)return'';const p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);};
const dLong=iso=>{if(!iso)return'';const d=new Date(iso+'T00:00:00');return d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear();};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const diasAte=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(hojeISO()+'T00:00:00'))/864e5);

function idade(iso){if(!iso)return'';const b=new Date(iso+'T00:00:00'),h=new Date();let a=h.getFullYear()-b.getFullYear(),m=h.getMonth()-b.getMonth();if(h.getDate()<b.getDate())m--;if(m<0){a--;m+=12;}return a>0?`${a} ano${a>1?'s':''}${m?` e ${m} m`:''}`:`${m} meses`;}
function prazo(iso){if(!iso)return{t:'sem data',cls:'',tag:'b',lbl:'sem registro'};const n=diasAte(iso);if(n<0)return{t:-n>=365?`há ${Math.floor(-n/365)} ano${-n>=730?'s':''}`:-n>=60?`há ${Math.floor(-n/30)} meses`:`${-n} d atrás`,cls:'late',tag:'late',lbl:'atrasada'};if(n===0)return{t:'hoje',cls:'late',tag:'late',lbl:'vence hoje'};if(n<=30)return{t:`em ${n} d`,cls:'soon',tag:'soon',lbl:'vence em breve'};return{t:dBR(iso),cls:'ok',tag:'ok',lbl:'em dia'};}
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),ms||(String(t).length>40?3400:1900));}
// erros: sempre em português, sem termo técnico
function msgErro(e,oque){const m=String((e&&(e.message||e.error_description||e.msg))||e||'');
  if(!navigator.onLine||/failed to fetch|failed to send|networkerror|load failed|network request failed|relay error/i.test(m))return'Sem internet. Tente de novo quando a conexão voltar.';
  if(/jwt|not authenticated|n[aã]o autorizado|refresh token|invalid claim|401/i.test(m)){sessaoExpirada();return'Sua sessão expirou. Entre de novo.';}
  if(/row-level|permission denied|42501|403/i.test(m))return'Sem permissão para isso.';
  if(/rate limit|too many|429/i.test(m))return'Muitas tentativas seguidas. Espere um minuto.';
  return(oque||'Não consegui salvar')+'. Tente de novo.';}
const ok=r=>{if(r&&r.error)throw r.error;return r;};
// ===== salvar só o que mudou =====
// A folha guarda o registro como ele estava quando abriu. Ao salvar, manda só os campos alterados —
// assim a edição de uma pessoa não apaga o que a outra mexeu em outro campo. Se o realtime trouxer
// uma mudança de fora num campo que esta pessoa também alterou, avisa antes de sobrescrever.
let FOLHA=null;
const LISTA_DE={pet_eventos:()=>EV,pet_rotinas:()=>ROT,pet_produtos:()=>PROD,pet_caes:()=>CAES};
const nz=v=>{if(v===''||v===undefined)return null;
  if(typeof v==='string'&&/^\d{2}:\d{2}:\d{2}$/.test(v))return v.slice(0,5);// hora do banco vem com segundos
  return v;};
const mesmoValor=(a,b)=>{a=nz(a);b=nz(b);
  if(a==null&&b==null)return true;if(a==null||b==null)return false;
  if(a!==''&&b!==''&&isFinite(a)&&isFinite(b))return Number(a)===Number(b);// 95 e "95.00" são o mesmo valor
  return String(a)===String(b);};
function abriuFolha(tab,id,obj){FOLHA=(id&&obj)?{tab,id,base:Object.assign({},obj),forcar:false}:null;}
// devolve {mud, conf}: mud = campos alterados nesta folha; conf = campos que outra pessoa também mudou
function soMudou(tab,id,row){
  if(!FOLHA||FOLHA.tab!==tab||FOLHA.id!==id)return{mud:row,conf:[]};
  const base=FOLHA.base,atual=((LISTA_DE[tab]||(()=>[]))().find(x=>x.id===id))||base;
  const mud={},conf=[];
  for(const k of Object.keys(row)){
    if(mesmoValor(row[k],base[k]))continue;
    mud[k]=row[k];
    if(!mesmoValor(base[k],atual[k])&&!mesmoValor(atual[k],row[k]))conf.push(k);}
  return{mud,conf};}
// true = pode gravar; false = avisou sobre o conflito e espera o segundo toque em Salvar
function podeGravar(conf){
  if(!conf.length||(FOLHA&&FOLHA.forcar))return true;
  if(FOLHA)FOLHA.forcar=true;
  const quais=conf.map(k=>(typeof LBL!=='undefined'&&LBL[k])||k).join(', ');
  toast('Este registro foi alterado por outra pessoa — revise ('+quais+'). Toque em Salvar de novo para gravar o que você escreveu.',7000);
  return false;}
const nadaMudou=()=>{closeSheet();toast('Nada mudou');};
// trava o botão enquanto salva (evita salvar duas vezes); em erro, destrava e mantém o formulário aberto
async function comBotao(btn,fn,txt){if(btn){if(btn.disabled)return false;btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent=txt||'Salvando…';}
  try{await fn();return true;}catch(e){console.warn(e);toast(msgErro(e));if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=btn.dataset.t;}return false;}}
const meu=x=>x.cao_id===cao||x.cao_id==null;
const pesoAtual=id=>EV.filter(e=>e.cao_id===id&&e.peso_kg&&e.data&&e.status==='realizado').sort((a,b)=>b.data.localeCompare(a.data))[0]||null;
const docById=id=>DOCS.find(d=>d.id===id);
const rotById=id=>ROT.find(r=>r.id===id);
// documentos de um registro: os ligados por evento_id + o anexo antigo (documento_id), sem repetir
function docsDoEv(e){if(!e)return[];const l=DOCS.filter(d=>d.evento_id===e.id);
  if(e.documento_id&&!l.some(d=>d.id===e.documento_id)){const d=docById(e.documento_id);if(d)l.unshift(d);}
  return l.slice().sort((a,b)=>a.id-b.id);}
const evDoDoc=d=>(d.evento_id?EV.find(e=>e.id===d.evento_id):null)||EV.find(e=>e.documento_id===d.id)||null;
// lembretes que um registro PODE alimentar: família de vacina > mesmo produto > mesmo título > todos do tipo
function rotCandidatos(ev){const rs=ROT.filter(r=>r.tipo===ev.tipo&&(r.cao_id===ev.cao_id||r.cao_id==null)&&r.ativo);if(rs.length<2)return rs;
  if(ev.tipo==='vacina'){const f=famDe(ev);if(f){const m=rs.filter(x=>f.re.test((x.titulo||'')+' '+(x.produto||'')));if(m.length)return m;}}
  const p=rs.filter(x=>x.produto&&ev.produto&&x.produto.toLowerCase()===ev.produto.toLowerCase());if(p.length)return p;
  const t=(titSub(ev).t||'').toLowerCase().trim();if(t){const m=rs.filter(x=>String(x.titulo||'').toLowerCase().trim()===t);if(m.length)return m;}
  return rs;}
// lembretes do cão para o campo "Lembrete" (os do mesmo tipo primeiro)
function listaRot(caoId,tipo){return ROT.filter(r=>r.ativo&&(r.cao_id===caoId||r.cao_id==null))

const optRot=(l,sel)=>`<option value="" ${sel==null?'selected':''}>Nenhum</option>`+l.map(r=>`<option value="${r.id}" ${sel===r.id?'selected':''}>${esc(r.titulo)}${r.cao_id==null?' (os dois)':''}</option>`).join('');
// registros recentes em que há mais de um lembrete possível: o app não chuta, pede a escolha
let SEM_VINC=[];try{SEM_VINC=JSON.parse(localStorage.getItem('fof_semvinc')||'[]');}catch(_){}
function semVinc(id){if(SEM_VINC.indexOf(id)<0){SEM_VINC.push(id);try{localStorage.setItem('fof_semvinc',JSON.stringify(SEM_VINC.slice(-300)));}catch(_){}}}
function precisaVinculo(e){return e&&e.rotina_id==null&&e.data&&['realizado','agendado'].includes(e.status)&&e.data>=addDays(hojeISO(),-45)&&SEM_VINC.indexOf(e.id)<0&&rotCandidatos(e).length>1;}
const agendado=e=>e.status==='agendado';
const aAgendar=e=>e.status==='a_agendar';
const hBR=t=>t?String(t).slice(0,5):'';
function famDe(e){const s=(e.titulo||'')+' '+(e.subtitulo||'')+' '+(e.produto||'');return FAM.find(f=>f.re.test(s));}
// título curto + subtítulo: usa a coluna subtitulo; em registros antigos, quebra pelo "(...)" final ou por " — " / ": " em títulos longos
function titSub(e){const t=String(e.titulo||'').trim();if(e.subtitulo)return{t,s:e.subtitulo};
  let m=t.match(/^(.{3,}?)\s*\(([^()]+)\)\s*$/);if(m)return{t:m[1].trim(),s:m[2].trim()};
  if(t.length>40){m=t.match(/^(.{3,}?)\s+[—–-]\s+(.+)$/)||t.match(/^(.{3,}?):\s+(.+)$/);if(m)return{t:m[1].trim(),s:m[2].trim()};}
  return{t,s:''};}
function stTag(e){return agendado(e)?'<span class="tag soon">agendado</span>':aAgendar(e)?'<span class="tag b">para agendar</span>':e.status==='cancelado'?'<span class="tag b">cancelado</span>':'';}

async function loadAll(){
  const [c,e,r,p,d,k]=await Promise.all([
    sb.from('pet_caes').select('*').eq('ativo',true).order('ordem'),
    sb.from('pet_eventos').select('*').order('data',{ascending:false,nullsFirst:false}).order('id',{ascending:false}),
    sb.from('pet_rotinas').select('*').order('ordem'),
    sb.from('pet_produtos').select('*').order('categoria').order('nome'),
    sb.from('pet_documentos').select('*').order('data_doc',{ascending:false,nullsFirst:true}).order('criado_em',{ascending:false}),
    sb.from('pet_contatos').select('*').order('ordem')]);
  for(const x of [c,e,r,p,d,k]) if(x.error) throw x.error;
  CAES=c.data;EV=e.data;ROT=r.data;PROD=p.data;DOCS=d.data;CONT=k.data;
  if(!CAES.some(x=>x.id===cao)){let s=null;try{s=+localStorage.getItem('fof_cao');}catch(_){}cao=CAES.some(x=>x.id===s)?s:(CAES[0]||{}).id;}
  await signFotos();renderSeg();signDocs();
}
// URLs assinadas dos documentos: valem 8 h e são renovadas quando falta menos de 1 h (SIGNED[p].t = quando vence)
const URL_VALE=288e5,URL_RENOVA=36e5;
const urlBoa=p=>{const s=SIGNED[p];return s&&(s.t-Date.now())>URL_RENOVA?s:null;};
async function signDocs(){const paths=[...new Set(DOCS.map(d=>d.path).filter(p=>p&&!urlBoa(p)))];if(!paths.length)return;
  try{const r=await sb.storage.from('pet-docs').createSignedUrls(paths,URL_VALE/1000);(r.data||[]).forEach(x=>{if(x.signedUrl&&!x.error)SIGNED[x.path]={url:x.signedUrl,t:Date.now()+URL_VALE};});}catch(_){}}
async function signFotos(){const paths=CAES.map(c=>c.foto_path).filter(Boolean);if(!paths.length)return;try{const r=await sb.storage.from('pet-docs').createSignedUrls(paths,604800);(r.data||[]).forEach(x=>{if(x.signedUrl&&!x.error)FOTOS[x.path]=x.signedUrl;});}catch(e){}}

// ===== cards =====
function rotCard(r){const t=TIPOS[r.tipo]||TIPOS.outro;const p=prazo(r.proxima_data);
  return`<div class="card"><div class="ic" style="background:${t.bg};color:${t.c}"><i class="ti ${t.ic}"></i></div>
    <div class="cb" role="button" tabindex="0" onclick="editRot(${r.id})"><div class="tt">${esc(r.titulo)}</div><div class="ts">${r.produto?esc(r.produto)+' · ':''}${r.ultima_data?'última '+dBR(r.ultima_data):'sem registro'}${r.ativo?'':' · pausado'}</div></div>
    <div class="cr"><div class="d ${p.cls}">${p.t}</div><button class="done-btn" type="button" aria-label="Concluir: ${esc(r.titulo)}" onclick="event.stopPropagation();sheetFeito(${r.id})">Concluir</button></div></div>`;}
function evCard(e,op){op=op||{};const t=TIPOS[e.tipo]||TIPOS.outro;const ds=docsDoEv(e);const doc=ds[0];const ts=titSub(e);
  const rot=rotById(e.rotina_id);const rotTit=rot&&String(rot.titulo||'').toLowerCase()!==ts.t.toLowerCase()?rot.titulo:'';
  const meta=[aAgendar(e)?(e.data?'até '+dBR(e.data):'sem data'):dBR(e.data)+(e.hora?' '+hBR(e.hora):''),e.produto&&!ts.s.includes(e.produto)&&!ts.t.includes(e.produto)?e.produto:'',e.lote?'lote '+e.lote:'',(e.veterinario||'').split('(')[0].trim()||e.clinica,e.peso_kg?kg(e.peso_kg):'',e.valor?money(e.valor):'',ds.length>1?ds.length+' documentos':'',rotTit].filter(Boolean).join(' · ');
  const acao=agendado(e)?`<button class="done-btn" onclick="event.stopPropagation();aconteceu(${e.id})">Concluir</button>`
    :aAgendar(e)?`<button class="done-btn" onclick="event.stopPropagation();sheetMarquei(${e.id})">Agendar</button>`
    :(e.confirmado?'':`<button class="mini ok" type="button" aria-label="Confirmar registro" onclick="event.stopPropagation();confirmar(${e.id})"><i class="ti ti-circle-check"></i></button>`);
  return`<div class="card${aAgendar(e)?' pend':''}" style="${e.confirmado?'':'border-color:#cdbfe8'}"><div class="ic" style="background:${t.bg};color:${t.c}"><i class="ti ${t.ic}"></i></div>
    <div class="cb" role="button" tabindex="0" onclick="editEv(${e.id})"><div class="tl"><div class="tt">${esc(ts.t)}</div>${aAgendar(e)||op.semTag?'':stTag(e)}${e.confirmado?'':'<span class="tag ia">para revisar</span>'}</div>${ts.s?`<div class="st">${esc(ts.s)}</div>`:''}<div class="ts">${esc(meta)}</div>${e.observacao&&!aAgendar(e)&&['exame','consulta','medicacao','cirurgia'].includes(e.tipo)?`<div class="obs" style="white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(e.observacao)}</div>`:''}${precisaVinculo(e)?`<div class="ts"><span role="button" tabindex="0" style="color:var(--azul);font-weight:600" onclick="event.stopPropagation();sheetVincular(${e.id})">escolher o lembrete</span></div>`:''}</div>
    ${doc?`<button class="mini doc" type="button" aria-label="${ds.length>1?ds.length+' documentos':'Abrir documento'}" onclick="event.stopPropagation();abrirAnexos(${e.id})"><i class="ti ti-file-text"></i>${ds.length>1?`<span style="font-size:11px;font-weight:700;margin-left:1px">${ds.length}</span>`:''}</button>`:''}
    ${acao}</div>`;}
function hrow(e){const ds=docsDoEv(e);const doc=ds[0];return`<div class="hrow"><div class="hd">${e.data?dBR(e.data):'—'}</div><div class="hb" role="button" tabindex="0" onclick="editEv(${e.id})"><b>${esc(e.produto||titSub(e).t)}</b>${!e.produto&&titSub(e).s?' · '+esc(titSub(e).s):''}${e.lote?' · lote '+esc(e.lote):''}${e.veterinario?' · '+esc(e.veterinario.split('(')[0].trim()):''}${ds.length>1?' · '+ds.length+' documentos':''}${stTag(e)?' '+stTag(e):''}${e.confirmado?'':' <span class="tag ia">para revisar</span>'}</div>${doc?`<button class="mini doc" type="button" aria-label="${ds.length>1?ds.length+' documentos':'Abrir documento'}" style="min-height:36px" onclick="abrirAnexos(${e.id})"><i class="ti ti-file-text"></i></button>`:''}</div>`;}

const V={};

V.hoje=()=>{const c=caoAtual();if(!c)return SEM_CAO;
  const rots=ROT.filter(r=>r.ativo&&meu(r)&&r.proxima_data).sort((a,b)=>a.proxima_data.localeCompare(b.proxima_data));
  const agsD=new Set(EV.filter(e=>agendado(e)&&e.cao_id===cao).map(e=>e.tipo+'|'+e.data));const late=rots.filter(r=>diasAte(r.proxima_data)<=0&&!agsD.has(r.tipo+'|'+r.proxima_data)),soon=rots.filter(r=>{const n=diasAte(r.proxima_data);return n>0&&n<=30;}),next=rots.filter(r=>diasAte(r.proxima_data)>30).sort((x,y)=>x.proxima_data.localeCompare(y.proxima_data));
  const aconf=EV.filter(e=>!e.confirmado&&e.cao_id===cao),novos=DOCS.filter(d=>d.status==='novo').length,pa=pesoAtual(c.id);
  let h=`<div class="hero ${fotoUrl(c)?'':'nofoto'}" style="${fotoUrl(c)?`--hero-img:url('${fotoUrl(c)}')`:''}"><div class="hn">${esc(c.nome)}</div><div class="hs">${[idade(c.nascimento),c.raca,pa?String(pa.peso_kg).replace('.',',')+' kg':''].filter(Boolean).map(esc).join(' · ')}</div>
    <div class="kpis"><div class="kpi"><b>${late.length}</b><span>atrasado${late.length===1?'':'s'}</span></div><div class="kpi"><b>${soon.length}</b><span>em 30 dias</span></div>${aconf.length?`<div class="kpi"><b>${aconf.length}</b><span>para revisar</span></div>`:''}</div></div>`;
  h+=`<div class="falar" role="button" tabindex="0" onclick="sheetFalar()"><i class="ti ti-microphone"></i><div>Adicionar por voz ou texto<span>“dei Bravecto na Stout hoje, 95 reais” · “banho dos dois ontem”</span></div></div>`;
  if(novos)h+=`<div class="note" role="button" tabindex="0" onclick="go('docs')" style="cursor:pointer;margin-top:10px"><b>${novos} documento${novos>1?'s':''} na caixa de entrada</b> — o Claude lê e registra à noite (ou peça "processa a caixa").</div>`;
  const amb=EV.filter(e=>e.cao_id===cao&&precisaVinculo(e));
  if(amb.length)h+=`<div class="t-mut" style="margin:12px 2px 0;padding-left:10px;border-left:2px solid var(--azul);line-height:1.6"><b style="color:var(--ink)">${esc(titSub(amb[0]).t)}</b>${amb[0].data?' ('+dBR(amb[0].data)+')':''} pode alimentar mais de um lembrete — não atualizei nenhum. <button class="lnk" type="button" style="padding:0" onclick="sheetVincular(${amb[0].id})">escolher o lembrete</button>${amb.length>1?`<br>e mais ${amb.length-1} registro${amb.length>2?'s':''} assim.`:''}</div>`;
  const ags=EV.filter(e=>agendado(e)&&e.cao_id===cao).sort((a,b)=>(a.data||'9999').localeCompare(b.data||'9999')||String(a.hora||'').localeCompare(String(b.hora||'')));
  if(ags.length)h+=`<div class="sec">Agendado</div>`+ags.map(e=>evCard(e,{semTag:1})).join('');
  const pend=EV.filter(e=>aAgendar(e)&&e.cao_id===cao).sort((a,b)=>(a.data||'9999').localeCompare(b.data||'9999')||a.id-b.id);
  if(pend.length)h+=`<div class="sec">Para agendar</div>`+pend.map(evCard).join('');
  if(late.length)h+=`<div class="sec">Atrasado</div>`+late.map(rotCard).join('');
  if(soon.length)h+=`<div class="sec">Próximos 30 dias</div>`+soon.map(rotCard).join('');
  if(next.length)h+=`<div class="sec">Mais adiante</div>`+next.map(rotCard).join('');
  if(!late.length&&!soon.length&&!next.length&&!ags.length&&!pend.length)h+=`<div class="empty"><b>Nada pendente</b>Crie lembretes na Carteirinha (vacinas, antipulgas, banho) e eles aparecem aqui quando estiverem perto de vencer.</div>`;
  if(aconf.length)h+=`<div class="sec">Para revisar (${aconf.length}) <span role="button" tabindex="0" onclick="confirmarTodos()">Confirmar todos</span></div>`+aconf.slice(0,aberto.aconf?999:4).map(evCard).join('')+(aconf.length>4&&!aberto.aconf?`<button class="lnk" type="button" onclick="toggle('aconf')">ver os ${aconf.length}</button>`:'');

V.cart=()=>{const vac=EV.filter(e=>e.tipo==='vacina'&&e.cao_id===cao);let h=`<div class="sec" style="margin-top:12px">Vacinas <span role="button" tabindex="0" onclick="editEv(null,{tipo:'vacina'})">+ vacina</span></div>`;
  const usadas=new Set();let fams=0;
  // a família aparece quando há dose registrada OU quando existe lembrete dela (vacina que nunca foi tomada também precisa aparecer)
  for(const f of FAM){const evs=vac.filter(e=>famDe(e)===f);const rot=ROT.find(r=>r.tipo==='vacina'&&meu(r)&&r.ativo&&f.re.test((r.titulo||'')+' '+(r.produto||'')));
    if(!evs.length&&!rot)continue;evs.forEach(e=>usadas.add(e.id));const last=evs.find(e=>e.status==='realizado'&&e.data)||evs.find(e=>e.status==='agendado'&&e.data)||{data:null};const prox=(rot&&rot.proxima_data)||last.proxima_data||(last.data?addDays(last.data,365):null);const p=prazo(prox);const k='f'+f.k;
    h+=`<div class="fam"><div class="fh" role="button" tabindex="0" aria-expanded="${!!aberto[k]}" onclick="toggle('${k}')"><div class="ic" style="background:${TIPOS.vacina.bg};color:${TIPOS.vacina.c}"><i class="ti ti-vaccine"></i></div><div class="cb"><div class="tt">${f.n}<span class="tag ${p.tag}">${p.lbl}</span></div><div class="ts">${last.data?'última '+dBR(last.data):'sem dose registrada'}${last.produto?' · '+esc(last.produto):''}${prox?' · próxima '+dBR(prox):''}</div></div><div class="cr"><button class="done-btn" onclick="event.stopPropagation();${rot?`sheetFeito(${rot.id})`:`editEv(null,{tipo:'vacina',titulo:'${f.n}'})`}" aria-label="Concluir: ${f.n}">Concluir</button></div></div>
      ${aberto[k]&&evs.length?`<div class="fb">${evs.map(hrow).join('')}</div>`:''}</div>`;fams++;}
  const outras=vac.filter(e=>!usadas.has(e.id));if(outras.length)h+=`<div class="fam"><div class="fh" role="button" tabindex="0" aria-expanded="${!!aberto.fout}" onclick="toggle('fout')"><div class="ic" style="background:${TIPOS.vacina.bg};color:${TIPOS.vacina.c}"><i class="ti ti-vaccine"></i></div><div class="cb"><div class="tt">Outras vacinas</div><div class="ts">${outras.length} registro${outras.length>1?'s':''}</div></div></div>${aberto.fout?`<div class="fb">${outras.map(hrow).join('')}</div>`:''}</div>`;
  if(!vac.length&&!fams)h+='<div class="vazio">Nenhuma vacina registrada.</div>';
  const bloco=(titulo,tipos,k)=>{const rs=ROT.filter(r=>tipos.includes(r.tipo)&&meu(r));const evs=EV.filter(e=>tipos.includes(e.tipo)&&e.cao_id===cao);let s=`<div class="sec">${titulo} <span role="button" tabindex="0" onclick="editRot(null,'${tipos[0]}')">+ lembrete</span></div>`;
    if(!rs.length&&!evs.length)return s+'<div class="vazio">Nada registrado ainda.</div>';
    s+=rs.map(rotCard).join('');
    if(evs.length)s+=`<div class="fam"><div class="fh" role="button" tabindex="0" aria-expanded="${!!aberto[k]}" onclick="toggle('${k}')"><div class="cb"><div class="tt" style="font-size:13.5px;color:var(--ink2)">Histórico · ${evs.length} registro${evs.length>1?'s':''}</div></div><i class="ti ti-chevron-${aberto[k]?'up':'down'}" style="color:var(--ink3)"></i></div>${aberto[k]?`<div class="fb">${evs.map(hrow).join('')}</div>`:''}</div>`;return s;};
  h+=bloco('Antipulgas e vermífugo',['antipulga','vermifugo'],'hprot');
  h+=bloco('Banho e tosa',['banho','tosa'],'hbanho');
  return h;};
V.vet=()=>{const c=caoAtual();if(!c)return SEM_CAO;let h=pesoChart(c);
  const ex=EV.filter(e=>e.tipo==='exame'&&e.cao_id===cao),co=EV.filter(e=>['consulta','medicacao','cirurgia','outro'].includes(e.tipo)&&e.cao_id===cao);

  h+=`<div class="sec">Consultas e orientações <span role="button" tabindex="0" onclick="editEv(null,{tipo:'consulta'})">+ consulta</span></div>`+(co.length?co.map(e=>evCard(e)).join(''):'<div class="vazio">Nenhuma consulta registrada.</div>');

  h+=`<div class="sec">Pesagens <span role="button" tabindex="0" onclick="editEv(null,{tipo:'peso',titulo:'Pesagem'})">+ peso</span></div><div class="fam"><div class="fb" style="border-top:none;background:var(--card)">${ps.length?ps.map(e=>`<div class="hrow"><div class="hd">${dBR(e.data)}</div><div class="hb" role="button" tabindex="0" onclick="editEv(${e.id})"><b>${String(e.peso_kg).replace('.',',')} kg</b>${e.tipo!=='peso'?' · '+esc(e.titulo):''}${e.clinica?' · '+esc(e.clinica):''}</div></div>`).join(''):'<div class="t-mut" style="padding:6px 0">Nenhuma pesagem registrada.</div>'}</div></div>`;
  return h;};
function pesoChart(c){const ps=EV.filter(e=>e.cao_id===c.id&&e.peso_kg&&e.data&&e.status==='realizado').sort((a,b)=>a.data.localeCompare(b.data));if(ps.length<2)return'';
  const W=440,H=120,P=28;const xs=ps.map(p=>new Date(p.data+'T12:00:00').getTime()),ys=ps.map(p=>+p.peso_kg);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)-.4,y1=Math.max(...ys)+.4;
  const X=t=>P+(t-x0)/(x1-x0||1)*(W-2*P),Y=v=>H-P+6-(v-y0)/(y1-y0||1)*(H-2*P);const pts=ps.map((p,i)=>`${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(' ');
  return`<div class="pet" style="padding:12px 14px;margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:13px;align-items:baseline"><b>Peso</b><span class="t-mut">${kg(ps[0].peso_kg)} (${dBR(ps[0].data)}) → ${kg(ps[ps.length-1].peso_kg)} (${dBR(ps[ps.length-1].data)})</span></div>
    <div class="chart" style="margin-top:10px"><svg role="img" aria-label="Gráfico do peso ao longo do tempo" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${caoCor(c)}" stroke-width="2.5" stroke-linejoin="round" points="${pts}"/>${ps.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="3.5" fill="${caoCor(c)}"/><text x="${X(xs[i]).toFixed(1)}" y="${(Y(ys[i])-9).toFixed(1)}" font-size="10" text-anchor="middle" fill="#4f5663">${String(p.peso_kg).replace('.',',')}</text>`).join('')}</svg></div></div>`;}
V.docs=()=>{const st={novo:['na caixa','novo'],processando:['lendo…','novo'],processado:['registrado','ok'],erro:['não consegui ler','late'],ignorado:['ignorado','b']};

  const inbox=DOCS.filter(d=>['novo','processando','erro'].includes(d.status));if(inbox.length)h+=`<div class="sec">Caixa de entrada</div>`+inbox.map(docCard).join('');

  for(const [k,n] of Object.entries(CATD)){const l=arq.filter(d=>(d.categoria||'outro')===k);if(l.length)h+=`<div class="sec">${n}</div>`+l.map(docCard).join('');}
  if(!arq.length&&!inbox.length)h+='<div class="empty"><b>Nenhum documento ainda</b>Tire foto de uma receita, exame ou carteira de vacina e envie pelo botão acima.</div>';
  return h;};

// ===== notificações push =====
let PUSH={sup:('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window),sub:null,pronto:false};
const naTela=()=>!!(navigator.standalone||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches));
const ehIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function urlBase64ToUint8Array(b){const pad='='.repeat((4-b.length%4)%4);const s=(b+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(s);const a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a;}
async function pushCheck(){if(!PUSH.sup){PUSH.pronto=true;return;}
  if(pushCheck._r)return;pushCheck._r=1;
  try{const reg=await navigator.serviceWorker.ready;PUSH.sub=await reg.pushManager.getSubscription();}catch(e){PUSH.sub=null;}
  PUSH.pronto=true;if(atual==='ficha')render('ficha');}
function pushSec(){const t=`<div class="sec">Notificações</div>`;
  if(!PUSH.sup||(ehIOS()&&!naTela()))return t+`<div class="pet"><div class="t-mut">No iPhone, adicione o app à Tela de Início pelo Safari e ative aqui dentro.</div></div>`;
  if(!PUSH.pronto)return t+`<div class="pet"><div class="t-mut">Verificando…</div></div>`;
  if(PUSH.sub)return t+`<div class="pet"><div style="font-size:14px;font-weight:600;margin-bottom:3px">Ativas neste aparelho</div><div class="t-mut">Os lembretes (vacinas, remédios, banho) e os avisos da caixa de entrada chegam aqui.</div><button class="btn" type="button" style="margin-top:12px" onclick="desativarPush(this)">Desativar</button></div>`;
  if(Notification.permission==='denied')return t+`<div class="pet"><div style="font-size:14px;font-weight:600;margin-bottom:3px">Bloqueadas neste aparelho</div><div class="t-mut">Libere nos Ajustes do celular (Notificações → Nossos Fofinhos) e volte aqui.</div></div>`;
  return t+`<div class="pet"><div style="font-size:14px;font-weight:600;margin-bottom:3px">Não ativadas neste aparelho</div><div class="t-mut">Ative para receber os lembretes e os avisos da caixa de entrada.</div><button class="btn btn-p" type="button" style="margin-top:12px" id="btnPush" onclick="ativarPush()">Ativar notificações</button></div>`;}
async function ativarPush(){const b=$('#btnPush');if(b){if(b.disabled)return;b.disabled=true;b.textContent='Ativando…';}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Notificações não permitidas neste aparelho');PUSH.pronto=true;render(atual);return;}
    const reg=await navigator.serviceWorker.ready;
    let s=await reg.pushManager.getSubscription();
    if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUB)});
    const sub=JSON.parse(JSON.stringify(s));
    const {data:{session}}=await sb.auth.getSession();
    const r=await sb.from('pet_push_subs').upsert({endpoint:sub.endpoint,sub:sub,email:(session&&session.user.email)||null,aparelho:navigator.userAgent.slice(0,120),ativo:true,falhas:0},{onConflict:'endpoint'});
    if(r.error)throw r.error;
    PUSH.sub=s;render(atual);toast('Notificações ativas');
  }catch(e){if(b){b.disabled=false;b.textContent='Ativar notificações';}console.warn(e);toast(msgErro(e,'Não consegui ativar as notificações'));}}

  abriuFolha('pet_produtos',id,id?b0:null);
  openSheet(`<h3>${id?'Editar produto':'Novo produto'}</h3>
  <div class="row2"><div class="field"><label>Cão</label>${selCao('pC',p.cao_id,true)}</div><div class="field"><label>Categoria</label><select id="pK">${Object.entries(CATP).map(([k,n])=>`<option value="${k}" ${p.categoria===k?'selected':''}>${n}</option>`).join('')}</select></div></div>
  <div class="field"><label>Nome</label><input id="pN" value="${esc(p.nome)}" placeholder="Ex.: Ração Premier Raças Pequenas"></div>
  <div class="row2"><div class="field"><label>Marca</label><input id="pM" value="${esc(p.marca)}"></div><div class="field"><label>Apresentação</label><input id="pA" value="${esc(p.apresentacao)}" placeholder="10,1 kg / 1 cp / 1 ml"></div></div>
  <div class="row2"><div class="field"><label>Dose / quantidade</label><input id="pD" value="${esc(p.dose)}" placeholder="80 g/dia"></div><div class="field"><label>Frequência</label><input id="pF" value="${esc(p.frequencia)}" placeholder="2x/dia · mensal"></div></div>
  <div class="row2"><div class="field"><label>Valor (R$)</label><input type="text" inputmode="decimal" autocomplete="off" id="pV" value="${p.valor||''}"></div><div class="field"><label>Onde compra</label><input id="pW" value="${esc(p.onde_compra)}"></div></div>
  <div class="field"><label>Observação</label><input id="pO" value="${esc(p.observacao)}"></div>
  <div class="field"><label><input type="checkbox" id="pU" ${p.em_uso?'checked':''} style="width:auto;margin-right:8px">Em uso</label></div>
  <button class="btn btn-p" type="button" onclick="saveProd(${id||'null'},this)">Salvar</button>${id?`<button class="btn btn-danger" type="button" style="margin-top:8px" onclick="delProd(${id},this)">Apagar</button>`:''}`);}
async function saveProd(id,btn){const n=val('pN');if(!n){toast('Informe o nome');return;}const row={cao_id:val('pC')?+val('pC'):null,categoria:val('pK'),nome:n,marca:val('pM')||null,apresentacao:val('pA')||null,dose:val('pD')||null,frequencia:val('pF')||null,valor:num('pV'),onde_compra:val('pW')||null,observacao:val('pO')||null,em_uso:$('#pU').checked};
  let env=row;
  if(id){const d=soMudou('pet_produtos',id,row);if(!podeGravar(d.conf))return;
    if(!Object.keys(d.mud).length)return nadaMudou();
    env=d.mud;}
  if(!await comBotao(btn,async()=>{if(id){const r=ok(await sb.from('pet_produtos').update(env).eq('id',id).select().single());const x=PROD.find(x=>x.id===id);if(x)Object.assign(x,r.data);}else{const r=ok(await sb.from('pet_produtos').insert(row).select().single());PROD.push(r.data);}}))return;
  closeSheet();render(atual);toast('Salvo');}
async function delProd(id,btn){if(!confirm('Apagar este produto?'))return;if(!await comBotao(btn,async()=>{ok(await sb.from('pet_produtos').delete().eq('id',id));},'Apagando…'))return;PROD=PROD.filter(x=>x.id!==id);closeSheet();render(atual);toast('Apagado');}

// --- cão ---

  <div class="row2"><div class="field"><label>Nascimento</label><input type="date" id="cN" value="${c.nascimento||''}"></div><div class="field"><label>Adoção</label><input type="date" id="cA" value="${c.adocao||''}"></div></div>
  <div class="row2"><div class="field"><label>Raça</label><input id="cR" value="${esc(c.raca)}"></div><div class="field"><label>Microchip</label><input id="cM" value="${esc(c.microchip)}"></div></div>
  <div class="row2"><div class="field"><label>Castrado</label><select id="cC"><option value="" ${c.castrado==null?'selected':''}>não informado</option><option value="1" ${c.castrado===true?'selected':''}>sim</option><option value="0" ${c.castrado===false?'selected':''}>não</option></select></div><div class="field"><label>Alergias</label><input id="cAl" value="${esc(c.alergias)}"></div></div>

async function saveCao(id,btn){const row={nascimento:val('cN')||null,adocao:val('cA')||null,raca:val('cR')||null,microchip:val('cM')||null,castrado:val('cC')===''?null:val('cC')==='1',alergias:val('cAl')||null,observacao:val('cO')||null};
  const d=soMudou('pet_caes',id,row);if(!podeGravar(d.conf))return;
  if(!Object.keys(d.mud).length)return nadaMudou();
  if(!await comBotao(btn,async()=>{const r=ok(await sb.from('pet_caes').update(d.mud).eq('id',id).select().single());const x=CAES.find(x=>x.id===id);if(x)Object.assign(x,r.data);}))return;
  closeSheet();renderSeg();render(atual);toast('Salvo');}

async function saveCont(id,btn){const row={papel:val('kP')||'Contato',nome:val('kN')||null,telefone:val('kT')||null,crmv:val('kC')||null,endereco:val('kE')||null,observacao:val('kO')||null};

  closeSheet();render(atual);toast('Salvo');}
async function delCont(id,btn){if(!confirm('Apagar este contato?'))return;if(!await comBotao(btn,async()=>{ok(await sb.from('pet_contatos').delete().eq('id',id));},'Apagando…'))return;CONT=CONT.filter(x=>x.id!==id);closeSheet();render(atual);toast('Apagado');}

// --- documentos ---
// enviar pela aba Documentos: primeiro pergunta de quem é (senão o documento cairia no cão do seletor sem ninguém ver)
function pickDocs(){openSheet(`<h3>De quem é esse documento?</h3><div class="t-mut" style="margin:-8px 0 14px">Fica guardado no nome do cão certo. Se não souber, o Claude descobre ao ler.</div>
  ${CAES.map(c=>`<button class="btn" type="button" style="margin-bottom:8px" onclick="escolherCaoDoc(${c.id})">${esc(c.nome)}</button>`).join('')}
  <button class="btn" type="button" onclick="escolherCaoDoc(null)">Não sei</button>`);}
function escolherCaoDoc(caoId){closeSheet();const fi=$('#filein');fi.value='';fi.setAttribute('multiple','');
  fi.onchange=e=>{const files=[...e.target.files];if(!files.length)return;enviarDocs(files,caoId);};fi.click();}
let ENVIO={files:[],cao:null};
const erroSimples=(e,oque)=>(e&&e.amigavel)||msgErro(e,oque);
async function enviarDocs(files,caoId){const falhas=[];
  for(let i=0;i<files.length;i++){
    toast(files.length>1?'Enviando '+(i+1)+' de '+files.length+'…':'Enviando…',60000);
    try{await uploadDoc(files[i],caoId);}catch(x){console.warn(x);falhas.push({f:files[i],m:erroSimples(x,'Não consegui enviar')});}}
  try{await loadAll();}catch(_){}go('docs');
  const n=files.length-falhas.length;
  if(!falhas.length){toast(n>1?n+' arquivos na caixa de entrada':'Na caixa de entrada');return;}
  ENVIO={files:falhas.map(x=>x.f),cao:caoId};
  openSheet(`<h3>${n?'Enviei '+n+' de '+files.length:'Não consegui enviar'}</h3>
    <div class="t-mut" style="margin:-8px 0 12px">${falhas.length===1?'Este arquivo não foi:':'Estes arquivos não foram:'}</div>
    ${falhas.map(x=>`<div class="hrow"><div class="hb"><b>${esc(x.f.name)}</b><div class="es">${esc(x.m)}</div></div></div>`).join('')}
    <button class="btn btn-p" type="button" style="margin-top:12px" onclick="repetirEnvio()">Tentar de novo</button>
    <button class="btn" type="button" style="margin-top:8px" onclick="closeSheet()">Deixar para depois</button>`);}
function repetirEnvio(){const f=(ENVIO.files||[]).slice();if(!f.length)return closeSheet();closeSheet();enviarDocs(f,ENVIO.cao);}
function shrink(file){return new Promise(res=>{const img=new Image();img.onerror=()=>res(file);img.onload=()=>{const M=1800,sc=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b||file),'image/jpeg',.82);URL.revokeObjectURL(img.src);};img.src=URL.createObjectURL(file);});}
// tipo e extensão reais do arquivo enviado (a foto vira JPEG; se não der para converter, sobe o original)
const mimeDe=(file,blob)=>file.type==='application/pdf'?'application/pdf':((blob&&blob.type)||file.type||'image/jpeg');
const extDe=m=>m==='application/pdf'?'.pdf':m==='image/jpeg'?'.jpg':'.'+((m.split('/')[1]||'img').replace(/[^a-z0-9]/gi,''));
const MAX_PDF=25*1024*1024;
const erroAmigavel=m=>{const e=new Error(m);e.amigavel=m;return e;};
async function uploadDoc(file,caoId){const pdf=file.type==='application/pdf';
  if(pdf&&file.size>MAX_PDF)throw erroAmigavel('Este PDF é grande demais ('+Math.round(file.size/1048576)+' MB, limite 25 MB) — mande as páginas principais como foto.');
  const blob=pdf?file:await shrink(file);const mime=mimeDe(file,blob);const path='inbox/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+extDe(mime);
  const up=await sb.storage.from('pet-docs').upload(path,blob,{contentType:mime});if(up.error)throw up.error;
  const ins=await sb.from('pet_documentos').insert({cao_id:caoId===undefined?cao:caoId,path,nome:file.name,tipo_mime:mime,status:'novo',enviado_por:autor});
  // se a linha não gravou, o arquivo solto sai do bucket (senão vira lixo que ninguém vê)
  if(ins.error){try{await sb.storage.from('pet-docs').remove([path]);}catch(_){}throw ins.error;}}
// abrir documento: a aba é aberta NO TOQUE (síncrono), senão o iPhone bloqueia; a URL entra depois de assinada.
// Se o aparelho bloquear mesmo assim, mostra um link para a pessoa tocar — nunca tira ela do app.
function abrirDoc(path){const s=urlBoa(path);
  const w=window.open(s?s.url:'','_blank');
  if(s){if(!w)linkDoc(s.url);return;}
  toast('Abrindo…');
  (async()=>{try{
    const r=await sb.storage.from('pet-docs').createSignedUrl(path,URL_VALE/1000);
    if(r.error||!r.data){if(w&&!w.closed)try{w.close();}catch(_){}toast(msgErro(r.error,'Não consegui abrir o documento'));return;}
    const url=(SIGNED[path]={url:r.data.signedUrl,t:Date.now()+URL_VALE}).url;
    if(w&&!w.closed){try{w.location=url;}catch(_){linkDoc(url);}}else linkDoc(url);
  }catch(e){if(w&&!w.closed)try{w.close();}catch(_){}toast(msgErro(e,'Não consegui abrir o documento'));}})();}
function linkDoc(url){openSheet(`<h3>Documento pronto</h3><div class="t-mut" style="margin:-8px 0 14px">O aparelho não deixou abrir sozinho. Toque no botão para ver.</div>
  <a class="btn btn-p" style="display:block;text-align:center;text-decoration:none" href="${esc(url)}" target="_blank" rel="noopener" onclick="closeSheet()">Abrir documento</a>`);}
// apagar: primeiro o arquivo, depois a linha — se o arquivo não sair, a linha fica e dá para tentar de novo
async function delDoc(id){if(!confirm('Apagar documento? Os registros ligados continuam, sem o anexo.'))return;const d=DOCS.find(x=>x.id===id);
  if(d&&d.path){const rf=await sb.storage.from('pet-docs').remove([d.path]);if(rf.error){toast(msgErro(rf.error,'Não consegui apagar o arquivo'));return;}}
  const rd=await sb.from('pet_documentos').delete().eq('id',id);if(rd.error){toast(msgErro(rd.error,'Não consegui apagar'));return;}DOCS=DOCS.filter(x=>x.id!==id);EV.forEach(e=>{if(e.documento_id===id)e.documento_id=null;});render(atual);toast('Apagado');}
async function anexarEv(id){const e=EV.find(x=>x.id===id);if(!e)return;const fi=$('#filein');fi.value='';fi.removeAttribute('multiple');
  fi.onchange=async ev=>{const f=(ev.target.files||[])[0];fi.setAttribute('multiple','');if(!f)return;
    try{toast('Enviando anexo…',60000);await anexarArquivo(id,f);}catch(err){console.warn(err);toast(erroSimples(err,'Não consegui enviar o anexo'));}};
  fi.click();}
// anexar SEMPRE adiciona um documento ao registro (nunca substitui o que já estava lá)
async function anexarArquivo(id,file){const e=EV.find(x=>x.id===id);if(!e)return;
  const pdf=file.type==='application/pdf';
  if(pdf&&file.size>MAX_PDF)throw erroAmigavel('Este PDF é grande demais ('+Math.round(file.size/1048576)+' MB, limite 25 MB) — mande as páginas principais como foto.');
  const blob=pdf?file:await shrink(file);const mime=mimeDe(file,blob);
  const path='anexos/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+extDe(mime);
  const up=await sb.storage.from('pet-docs').upload(path,blob,{contentType:mime});if(up.error)throw up.error;
  const n=docsDoEv(e).length;
  const row={cao_id:e.cao_id,path,evento_id:id,nome:(titSub(e).t||'Anexo')+(e.data?' · '+dBR(e.data):'')+(n?' ('+(n+1)+')':''),tipo_mime:mime,status:'processado',categoria:e.tipo==='exame'?'exame':'outro',data_doc:e.data,resumo:'Anexado manualmente ao registro',enviado_por:autor};
  const ins=await sb.from('pet_documentos').insert(row).select().single();
  if(ins.error){try{await sb.storage.from('pet-docs').remove([path]);}catch(_){}throw ins.error;}
  DOCS.unshift(ins.data);
  // compatibilidade: o primeiro documento também fica no campo antigo (telas antigas e rotinas do Mac)
  if(!e.documento_id){const u=await sb.from('pet_eventos').update({documento_id:ins.data.id}).eq('id',id).select().single();if(u.error)throw u.error;Object.assign(e,u.data);}
  render(atual);editEv(id);toast('Anexo salvo');}
// tirar o anexo desliga o vínculo; o documento continua na aba Documentos
async function removerAnexo(id,docId){const e=EV.find(x=>x.id===id);if(!e)return;
  if(!confirm('Tirar este documento do registro? Ele continua na aba Documentos.'))return;
  const r=await sb.from('pet_documentos').update({evento_id:null}).eq('id',docId);
  if(r.error){toast(msgErro(r.error));return;}
  const d=docById(docId);if(d)d.evento_id=null;
  if(e.documento_id===docId){const resto=docsDoEv(e).filter(x=>x.id!==docId)[0]||null;
    const u=await sb.from('pet_eventos').update({documento_id:resto?resto.id:null}).eq('id',id).select().single();
    if(u.error){toast(msgErro(u.error));return;}Object.assign(e,u.data);}
  render(atual);editEv(id);toast('Documento desligado');}
// abrir o anexo: um só abre direto; vários abrem o registro, que lista todos
function abrirAnexos(id){const e=EV.find(x=>x.id===id);if(!e)return;const ds=docsDoEv(e);
  if(ds.length===1)return abrirDoc(ds[0].path);
  editEv(id);}
// ligar um documento a um registro já existente (mais recentes primeiro, com busca por título)
function sheetLigar(docId){const d=docById(docId);if(!d)return;const c=d.cao_id||cao;
  openSheet(`<h3>Ligar a um registro</h3><div class="t-mut" style="margin:-8px 0 14px">${esc(d.nome||d.path.split('/').pop())} — ${esc(nomeCao(c))}</div>
  <div class="field"><label>Buscar</label><input id="lQ" autocomplete="off" placeholder="Ultrassom, consulta, vacina…" oninput="listarLigar(${docId})"></div>
  <div id="lL"></div>`);listarLigar(docId);}
function listarLigar(docId){const d=docById(docId);const box=$('#lL');if(!d||!box)return;const c=d.cao_id||cao;
  const q=(val('lQ')||'').toLowerCase();
  const l=EV.filter(e=>e.cao_id===c&&(!q||((e.titulo||'')+' '+(e.subtitulo||'')+' '+(e.produto||'')).toLowerCase().includes(q))).sort(porData).slice(0,40);
  box.innerHTML=l.length?l.map(e=>{const ts=titSub(e);const n=docsDoEv(e).length;
    return`<div class="hrow"><div class="hd">${e.data?dBR(e.data):'—'}</div><div class="hb" role="button" tabindex="0" onclick="saveLigar(${docId},${e.id})"><b>${esc(ts.t)}</b>${ts.s?' · '+esc(ts.s):''}${n?' · '+n+' doc'+(n>1?'s':''):''}${e.id===d.evento_id?' <span class="tag ok">ligado</span>':''}</div></div>`;}).join('')
    :'<div class="vazio">Nenhum registro com esse texto.</div>';}
async function saveLigar(docId,evId){const d=docById(docId),e=EV.find(x=>x.id===evId);if(!d||!e)return;
  const r=await sb.from('pet_documentos').update({evento_id:evId,cao_id:d.cao_id||e.cao_id}).eq('id',docId).select().single();
  if(r.error){toast(msgErro(r.error,'Não consegui ligar'));return;}Object.assign(d,r.data);
  if(!e.documento_id){const u=await sb.from('pet_eventos').update({documento_id:docId}).eq('id',evId).select().single();if(!u.error)Object.assign(e,u.data);}
  closeSheet();render(atual);toast('Ligado a '+titSub(e).t);}
async function reprocessar(id){const r=await sb.from('pet_documentos').update({status:'novo',erro:null}).eq('id',id);if(r.error){toast(msgErro(r.error));return;}const d=DOCS.find(x=>x.id===id);if(d){d.status='novo';d.erro=null;}render(atual);toast('Voltou para a caixa de entrada');}

// ===== boot =====
function render(v){try{$('#view').innerHTML=(V[v]||V.hoje)();}catch(e){console.error(e);$('#view').innerHTML='<div class="empty"><b>Algo deu errado nesta tela</b>Recarregue para tentar de novo.<br><button class="btn" type="button" onclick="location.reload()">Recarregar</button></div>';}}
function go(v){atual=v;render(v);window.scrollTo(0,0);document.querySelectorAll('nav a').forEach(a=>{const on=a.dataset.go===v;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
// teclado: Esc fecha; Enter/espaço aciona o que tem role=button
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('on'))closeSheet();
  const t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')&&/^(button|tab)$/.test(t.getAttribute('role'))&&t.tagName!=='BUTTON'){e.preventDefault();t.click();}});
function erroCarga(e){const m=String((e&&e.message)||e||'');if(/jwt|401|token/i.test(m))sessaoExpirada();const off=!navigator.onLine||/fetch|network|load failed/i.test(m);
  return`<div class="empty"><b>${off?'Sem internet':'Não consegui carregar'}</b>${off?'Confira a conexão e tente de novo.':'Tente de novo em instantes.'}<br><button class="btn" type="button" onclick="tentarCarregar()">Tentar de novo</button></div>`;}
async function tentarCarregar(){$('#view').innerHTML='<div class="empty">Carregando…</div>';try{await loadAll();render(atual);}catch(e){$('#view').innerHTML=erroCarga(e);}}
async function sessaoExpirada(){try{const {data:{session}}=await sb.auth.getSession();if(session)return;}catch(_){}BOOTED=null;$('#login').classList.add('on');}
let _rt;function scheduleReload(p){if(p&&p.table&&!/^pet_/.test(p.table))return;clearTimeout(_rt);_rt=setTimeout(async()=>{try{await loadAll();render(atual);}catch(e){}},700);}
const FAMILIA=['chiapinotto@gmail.com','carolinecaye@gmail.com'];
function setAutorDe(email){autor=(email||'').toLowerCase().indexOf('caroline')>-1?'Carol':'Fernando';}
// boot roda uma vez por login (o Supabase repete o aviso de "entrou" ao voltar para o app)
let BOOTED=null,CANAL=null;
async function boot(){
  let session=null;try{({data:{session}}=await sb.auth.getSession());}catch(_){}
  const em=((session&&session.user.email)||'').toLowerCase();
  if(!session||!FAMILIA.includes(em)){if(session)await sb.auth.signOut();BOOTED=null;$('#login').classList.add('on');$('#view').innerHTML='';return;}
  $('#login').classList.remove('on');
  if(BOOTED===em)return;BOOTED=em;setAutorDe(em);
  $('#view').innerHTML='<div class="empty">Carregando…</div>';
  try{await loadAll();render(atual);}
  catch(e){console.warn(e);$('#view').innerHTML=erroCarga(e);}
  if(!CANAL){try{CANAL=sb.channel('pets').on('postgres_changes',{event:'*',schema:'public'},scheduleReload).subscribe();}catch(e){}}
}
sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='SIGNED_IN'&&sess){setTimeout(boot,0);}

    const c=camposEv(a.campos);if(!Object.keys(c).length)return;

    const x=EV.find(e=>e.id===a.id);if(x)Object.assign(x,r.data);else EV.unshift(r.data);
    await syncRotina(r.data);return;}
  if(a.tipo==='rotina_nova'){
    const r=await sb.from('pet_rotinas').insert(Object.assign(rotRow(a.rotina),{ordem:50})).select().single();if(r.error)throw r.error;
    ROT.push(r.data);return;}
  if(a.tipo==='rotina_atualizar'){
    const c=camposRot(a.campos);if(!Object.keys(c).length)return;
    const r=await sb.from('pet_rotinas').update(c).eq('id',a.id).select().single();if(r.error)throw r.error;
    const x=ROT.find(e=>e.id===a.id);if(x)Object.assign(x,r.data);else ROT.push(r.data);return;}
  if(a.tipo==='produto_novo'){
    const r=await sb.from('pet_produtos').insert(prodRowIA(a.produto)).select().single();if(r.error)throw r.error;
    PROD.push(r.data);return;}
  if(a.tipo==='produto_atualizar'){
    const c=camposProd(a.campos);if(!Object.keys(c).length)return;
    const r=await sb.from('pet_produtos').update(c).eq('id',a.id).select().single();if(r.error)throw r.error;
    const x=PROD.find(e=>e.id===a.id);if(x)Object.assign(x,r.data);return;}}
// marca a linha de pet_entradas desta conversa como aplicada (o id vem da função, nunca "a última do banco")
async function marcarEntradaAplicada(){const id=ENTRADA&&ENTRADA.entradaId;if(!id)return;
  try{await sb.from('pet_entradas').update({aplicado:true}).eq('id',id);}catch(_){}}
// salva item por item; o que falhar FICA na folha com "Tentar de novo" — a folha só fecha quando tudo gravou
async function salvarEntrada(){const acoes=((ENTRADA&&ENTRADA.acoes)||[]).slice();if(!acoes.length||salvarEntrada._b)return;
  salvarEntrada._b=1;const b=$('#btEnt');if(b){b.disabled=true;b.textContent='Salvando…';}
  const falhas=[];let n=0;
  for(const a of acoes){try{await aplicarAcao(a);n++;}catch(err){console.warn(err);falhas.push({a,m:erroSimples(err,'Não consegui salvar')});}}
  salvarEntrada._b=0;EV.sort(porData);
  if(n)await marcarEntradaAplicada();
  ENTRADA.acoes=falhas.map(x=>x.a);
  render(atual);
  if(!falhas.length){closeSheet();toast(n===1?'Salvo':n+' itens salvos');return;}
  openSheet(`<h3>${n?'Salvei '+n+' de '+acoes.length:'Não consegui salvar'}</h3>
    <div class="t-mut" style="margin:-8px 0 12px">${falhas.length===1?'Este item não gravou:':'Estes itens não gravaram:'}</div>
    ${falhas.map((x,i)=>acaoLinha(x.a,i)+`<div class="t-mut" style="margin:-6px 2px 10px;color:var(--rosa)">${esc(x.m)}</div>`).join('')}
    <button class="btn btn-p" type="button" id="btEnt" style="margin-top:4px" onclick="salvarEntrada()">Tentar de novo</button>
    <button class="btn" type="button" style="margin-top:8px" onclick="closeSheet()">Deixar para depois</button>`);}
async function refreshApp(manual){if($('#login').classList.contains('on')||!BOOTED)return;const b=$('#btnRefresh');if(b.classList.contains('spin'))return;b.classList.add('spin');const t0=Date.now();
  try{await loadAll();render(atual);}catch(e){console.warn(e);if(!CAES.length)$('#view').innerHTML=erroCarga(e);else if(manual!==false)toast(msgErro(e,'Não consegui atualizar'));}
  setTimeout(()=>b.classList.remove('spin'),Math.max(0,500-(Date.now()-t0)));}
// internet
function redeUI(){$('#offline').classList.toggle('on',!navigator.onLine);}
window.addEventListener('online',()=>{redeUI();refreshApp(false);});window.addEventListener('offline',redeUI);redeUI();
// nova versão: avisa quando o site publicado for mais novo que esta tela (sem ficar preso em versão velha)
let _verT=0;const _carregada=Date.parse(document.lastModified)||Date.now();
async function checarVersao(){if(Date.now()-_verT<5*60e3||!navigator.onLine)return;_verT=Date.now();
  try{const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});const lm=Date.parse(r.headers.get('last-modified')||'');if(lm&&lm>_carregada+1000)$('#upd').classList.add('on');}catch(_){}}
if('serviceWorker' in navigator){const tinhaSW=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg=>{pushCheck();document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{});});}).catch(()=>{PUSH.pronto=true;});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(tinhaSW)$('#upd').classList.add('on');});}
else{PUSH.pronto=true;}
boot();
setTimeout(checarVersao,4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshApp(false);checarVersao();}});
</script>
