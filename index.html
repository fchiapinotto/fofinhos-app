<style>

    --ink:#1b2330;--ink2:#5f6673;--ink3:#9aa1ad;--bg:#f5f4f0;--card:#fff;--line:#e8e6e0;--r:16px;--rl:20px;--hero-img:none;

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}

  .doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:9px}

  .lnk{color:var(--verde);font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;padding:0}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
  nav a{flex:1;text-align:center;color:var(--ink3);font-size:10.5px;font-weight:500;text-decoration:none;cursor:pointer}nav a i{display:block;font-size:22px;margin-bottom:2px}nav a.on{color:var(--verde)}
  .fab{position:fixed;bottom:84px;right:max(16px,calc(50% - 240px + 16px));z-index:25;width:54px;height:54px;border-radius:50%;background:var(--verde);color:#fff;border:none;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 22px rgba(51,80,42,.35)}.fab:active{transform:scale(.94)}
  .sheet{position:fixed;inset:0;background:rgba(15,22,35,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}.sheet.on{display:flex}

  .login-in h2{margin:0 0 4px;font-size:22px}.login-in p{margin:0 0 18px;font-size:13.5px;color:var(--ink2)}
  .login-in .field{text-align:left}.login .err{color:var(--rosa);font-size:13px;margin-top:10px;min-height:18px}
  .falar{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px dashed var(--verde);border-radius:var(--r);padding:12px 14px;margin:10px 0 4px;cursor:pointer;color:var(--verde);font-weight:600;font-size:14.5px}
  .falar i{font-size:22px}.falar span{color:var(--ink2);font-weight:400;font-size:12.5px;display:block}
  .ent{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ent:last-child{border-bottom:none}.ent .et{font-size:14px;font-weight:600}.ent .es{font-size:12.5px;color:var(--ink2)}
  .ouv{display:flex;align-items:center;gap:9px;background:var(--verde-cl);color:var(--verde-d);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin:-4px 0 12px}
  .pulso{width:10px;height:10px;border-radius:50%;background:var(--verde);animation:pul 1s ease-in-out infinite;flex-shrink:0}
  @keyframes pul{0%,100%{transform:scale(.7);opacity:.45}50%{transform:scale(1.25);opacity:1}}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 9px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer}
  .chip.on{background:var(--verde);border-color:var(--verde);color:#fff}
  .perg{background:#fbfaf7;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px}
  .perg .pq{font-size:14.5px;font-weight:600;line-height:1.35}
  .mais{display:inline-flex;align-items:center;gap:6px;color:var(--verde);font-size:13.5px;font-weight:600;cursor:pointer;margin:0 0 14px;padding:2px 0}
  .anexo{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--azul);color:var(--azul);background:var(--azul-cl);border-radius:13px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin:0 0 12px}
  #btnRefresh.spin{animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<script>
const $=(s,e=document)=>e.querySelector(s);
const SB_URL="https://fctyjollnxthppfjtilq.supabase.co";

const VAPID_PUB="BFl2xeodAzpajWVf7ZTtdM08YG5e8znV1uIsMsHmFNN3l9_PVOX1tSlXjbPMf5DzEL9v4lVYNTuxR2j2is6NpJc";
const sb=window.supabase.createClient(SB_URL,SB_KEY);

// ===== referência =====
const TIPOS={vacina:{n:"Vacina",ic:"ti-vaccine",c:"#2f5da3",bg:"#e9f0fa"},vermifugo:{n:"Vermífugo",ic:"ti-pill",c:"#6b4fa0",bg:"#ece7f7"},antipulga:{n:"Antipulgas e carrapatos",ic:"ti-bug",c:"#b8860b",bg:"#f8f1dc"},
  banho:{n:"Banho",ic:"ti-bath",c:"#1f8a9e",bg:"#e0f2f5"},tosa:{n:"Tosa",ic:"ti-scissors",c:"#1f8a9e",bg:"#e0f2f5"},consulta:{n:"Consulta",ic:"ti-stethoscope",c:"#4a6b3a",bg:"#e9f0e4"},
  exame:{n:"Exame",ic:"ti-file-analytics",c:"#c8506a",bg:"#fbe8ed"},medicacao:{n:"Medicação",ic:"ti-medicine-syrup",c:"#6b4fa0",bg:"#ece7f7"},peso:{n:"Peso",ic:"ti-scale",c:"#5f6673",bg:"#eeeeea"},

const TIPOS_EV=['vacina','vermifugo','antipulga','banho','tosa','consulta','exame','medicacao','peso','cirurgia','outro'];
const TIPOS_ROT=['vacina','vermifugo','antipulga','banho','tosa','consulta','exame','medicacao','higiene','outro'];

let CAES=[],EV=[],ROT=[],PROD=[],DOCS=[],CONT=[];

// ===== helpers =====

const dBR=iso=>{if(!iso)return'';const p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);};

const fotoUrl=c=>(c&&c.foto_path&&FOTOS[c.foto_path])||null;
function idade(iso){if(!iso)return'';const b=new Date(iso+'T00:00:00'),h=new Date();let a=h.getFullYear()-b.getFullYear(),m=h.getMonth()-b.getMonth();if(h.getDate()<b.getDate())m--;if(m<0){a--;m+=12;}return a>0?`${a} ano${a>1?'s':''}${m?` e ${m} m`:''}`:`${m} meses`;}
function prazo(iso){if(!iso)return{t:'sem data',cls:'',tag:'b',lbl:'sem registro'};const n=diasAte(iso);if(n<0)return{t:`${-n} d atrás`,cls:'late',tag:'late',lbl:'vencida'};if(n===0)return{t:'hoje',cls:'late',tag:'late',lbl:'vence hoje'};if(n<=30)return{t:`em ${n} d`,cls:'soon',tag:'soon',lbl:'vence em breve'};return{t:dBR(iso),cls:'ok',tag:'ok',lbl:'em dia'};}

// ===== carregar =====
async function loadAll(){
  const [c,e,r,p,d,k]=await Promise.all([
    sb.from('pet_caes').select('*').eq('ativo',true).order('ordem'),
    sb.from('pet_eventos').select('*').order('data',{ascending:false}).order('id',{ascending:false}),
    sb.from('pet_rotinas').select('*').order('ordem'),
    sb.from('pet_produtos').select('*').order('categoria').order('nome'),
    sb.from('pet_documentos').select('*').order('data_doc',{ascending:false,nullsFirst:true}).order('criado_em',{ascending:false}),
    sb.from('pet_contatos').select('*').order('ordem')]);
  for(const x of [c,e,r,p,d,k]) if(x.error) throw x.error;
  CAES=c.data;EV=e.data;ROT=r.data;PROD=p.data;DOCS=d.data;CONT=k.data;
  if(!CAES.some(x=>x.id===cao)){let s=null;try{s=+localStorage.getItem('fof_cao');}catch(_){}cao=CAES.some(x=>x.id===s)?s:(CAES[0]||{}).id;}
  await signFotos();renderSeg();
}
async function signFotos(){const paths=CAES.map(c=>c.foto_path).filter(Boolean);if(!paths.length)return;try{const r=await sb.storage.from('pet-docs').createSignedUrls(paths,604800);(r.data||[]).forEach(x=>{if(x.signedUrl&&!x.error)FOTOS[x.path]=x.signedUrl;});}catch(e){}}
function renderSeg(){$('#segCao').innerHTML=CAES.map(c=>`<div class="${cao===c.id?'on '+(c.nome==='Jorge'?'j':'s'):''}" onclick="setCao(${c.id})">${fotoUrl(c)?`<img src="${fotoUrl(c)}" alt="">`:''}${c.nome}</div>`).join('');}
function setCao(v){cao=v;try{localStorage.setItem('fof_cao',v);}catch(_){}renderSeg();render(atual);}

function rotCard(r){const t=TIPOS[r.tipo]||TIPOS.outro;const p=prazo(r.proxima_data);

    <div class="cb" onclick="editRot(${r.id})"><div class="tt">${esc(r.titulo)}</div><div class="ts">${r.produto?esc(r.produto)+' · ':''}${r.ultima_data?'última '+dBR(r.ultima_data):'sem registro'}${r.ativo?'':' · pausada'}</div></div>
    <div class="cr"><div class="d ${p.cls}">${p.t}</div><button class="done-btn" onclick="event.stopPropagation();sheetFeito(${r.id})">Feito</button></div></div>`;}
function evCard(e){const t=TIPOS[e.tipo]||TIPOS.outro;const doc=docById(e.documento_id);const sub=[e.produto,e.lote?'lote '+e.lote:'',e.veterinario||e.clinica,e.peso_kg?e.peso_kg+' kg':'',e.valor?money(e.valor):''].filter(Boolean).join(' · ');

    ${doc?`<button class="mini doc" title="Abrir documento" onclick="event.stopPropagation();abrirDoc('${esc(doc.path)}')"><i class="ti ti-file-text"></i></button>`:''}
    ${agendado(e)?`<button class="done-btn" onclick="event.stopPropagation();aconteceu(${e.id})">Aconteceu</button>`:(e.confirmado?'':`<button class="mini ok" title="Confirmar" onclick="event.stopPropagation();confirmar(${e.id})"><i class="ti ti-circle-check"></i></button>`)}</div>`;}
function hrow(e){const doc=docById(e.documento_id);return`<div class="hrow"><div class="hd">${dBR(e.data)}</div><div class="hb" onclick="editEv(${e.id})"><b>${esc(e.produto||e.titulo)}</b>${e.lote?' · lote '+esc(e.lote):''}${e.veterinario?' · '+esc(e.veterinario.split('(')[0].trim()):''}${agendado(e)?' <span class="tag soon">agendado</span>':''}${e.confirmado?'':' <span class="tag ia">a confirmar</span>'}</div>${doc?`<i class="ti ti-file-text" style="color:var(--azul);cursor:pointer" onclick="abrirDoc('${esc(doc.path)}')"></i>`:''}</div>`;}

V.cart=()=>{const vac=EV.filter(e=>e.tipo==='vacina'&&e.cao_id===cao);let h=`<div class="sec" style="margin-top:12px">Vacinas <span onclick="editEv(null,{tipo:'vacina'})">+ dose</span></div>`;

    h+=`<div class="fam"><div class="fh" onclick="toggle('${k}')"><div class="ic" style="background:${TIPOS.vacina.bg};color:${TIPOS.vacina.c}"><i class="ti ti-vaccine"></i></div><div class="cb"><div class="tt">${f.n}<span class="tag ${p.tag}">${p.lbl}</span></div><div class="ts">última ${dBR(last.data)}${last.produto?' · '+esc(last.produto):''} · próxima ${dBR(prox)}</div></div><div class="cr"><button class="done-btn" onclick="event.stopPropagation();${rot?`sheetFeito(${rot.id})`:`editEv(null,{tipo:'vacina',titulo:'${f.n}'})`}">Dose</button></div></div>

  const outras=vac.filter(e=>!usadas.has(e.id));if(outras.length)h+=`<div class="fam"><div class="fh" onclick="toggle('fout')"><div class="ic" style="background:${TIPOS.vacina.bg};color:${TIPOS.vacina.c}"><i class="ti ti-vaccine"></i></div><div class="cb"><div class="tt">Outras vacinas</div><div class="ts">${outras.length} registro${outras.length>1?'s':''}</div></div></div>${aberto.fout?`<div class="fb">${outras.map(hrow).join('')}</div>`:''}</div>`;

V.vet=()=>{const c=caoAtual();let h=pesoChart(c);

function pesoChart(c){const ps=EV.filter(e=>e.cao_id===c.id&&e.peso_kg).sort((a,b)=>a.data.localeCompare(b.data));if(ps.length<2)return'';
  const W=440,H=120,P=28;const xs=ps.map(p=>new Date(p.data).getTime()),ys=ps.map(p=>+p.peso_kg);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)-.4,y1=Math.max(...ys)+.4;
  const X=t=>P+(t-x0)/(x1-x0||1)*(W-2*P),Y=v=>H-P+6-(v-y0)/(y1-y0||1)*(H-2*P);const pts=ps.map((p,i)=>`${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(' ');
  return`<div class="pet" style="padding:12px 14px;margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:13px;align-items:baseline"><b>Peso</b><span class="t-mut">${ps[0].peso_kg} kg (${dBR(ps[0].data)}) → ${ps[ps.length-1].peso_kg} kg (${dBR(ps[ps.length-1].data)})</span></div>
    <div class="chart" style="margin-top:10px"><svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${caoCor(c)}" stroke-width="2.5" stroke-linejoin="round" points="${pts}"/>${ps.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="3.5" fill="${caoCor(c)}"/><text x="${X(xs[i]).toFixed(1)}" y="${(Y(ys[i])-9).toFixed(1)}" font-size="10" text-anchor="middle" fill="#5f6673">${p.peso_kg}</text>`).join('')}</svg></div></div>`;}

// ===== notificações push =====
let PUSH={sup:('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window),sub:null,pronto:false};
const naTela=()=>!!(navigator.standalone||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches));
const ehIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function urlBase64ToUint8Array(b){const pad='='.repeat((4-b.length%4)%4);const s=(b+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(s);const a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a;}
async function pushCheck(){if(!PUSH.sup){PUSH.pronto=true;return;}
  try{const reg=await navigator.serviceWorker.ready;PUSH.sub=await reg.pushManager.getSubscription();}catch(e){PUSH.sub=null;}
  PUSH.pronto=true;if(atual==='ficha')render('ficha');}
function pushSec(){const t=`<div class="sec">Notificações</div>`;
  if(!PUSH.sup||(ehIOS()&&!naTela()))return t+`<div class="pet"><div class="t-mut">No iPhone, adicione o app à Tela de Início pelo Safari e ative aqui dentro.</div></div>`;
  if(!PUSH.pronto)return t+`<div class="pet"><div class="t-mut">Verificando…</div></div>`;
  if(PUSH.sub)return t+`<div class="pet"><div style="font-size:14px;font-weight:600;margin-bottom:3px">Ativas neste aparelho</div><div class="t-mut">Lembretes de vacinas e rotinas e avisos da caixa de entrada chegam aqui.</div><button class="btn" style="margin-top:12px" onclick="desativarPush()">Desativar</button></div>`;
  if(Notification.permission==='denied')return t+`<div class="pet"><div style="font-size:14px;font-weight:600;margin-bottom:3px">Bloqueadas neste aparelho</div><div class="t-mut">Libere nos Ajustes do celular (Notificações → Nossos Fofinhos) e volte aqui.</div></div>`;
  return t+`<div class="pet"><div style="font-size:14px;font-weight:600;margin-bottom:3px">Não ativadas neste aparelho</div><div class="t-mut">Ative para receber os lembretes e os avisos da caixa de entrada.</div><button class="btn btn-p" style="margin-top:12px" id="btnPush" onclick="ativarPush()">Ativar notificações</button></div>`;}
async function ativarPush(){const b=$('#btnPush');if(b){b.disabled=true;b.textContent='Ativando…';}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Permissão não concedida');PUSH.pronto=true;render('ficha');return;}
    const reg=await navigator.serviceWorker.ready;
    let s=await reg.pushManager.getSubscription();
    if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUB)});
    const sub=JSON.parse(JSON.stringify(s));
    const {data:{session}}=await sb.auth.getSession();
    const r=await sb.from('pet_push_subs').upsert({endpoint:sub.endpoint,sub:sub,email:(session&&session.user.email)||null,aparelho:navigator.userAgent.slice(0,120),ativo:true,falhas:0},{onConflict:'endpoint'});
    if(r.error)throw r.error;
    PUSH.sub=s;render('ficha');toast('Notificações ativas');
  }catch(e){if(b){b.disabled=false;b.textContent='Ativar notificações';}toast('Não consegui ativar: '+((e&&e.message)||e));}}
async function desativarPush(){try{
    const s=PUSH.sub;if(s){const ep=s.endpoint;try{await s.unsubscribe();}catch(e){}await sb.from('pet_push_subs').delete().eq('endpoint',ep);}
    PUSH.sub=null;render('ficha');toast('Notificações desativadas');
  }catch(e){toast('Não consegui desativar');}}

// ===== sheets =====
function openSheet(h){$('#sheetIn').innerHTML=h;$('#sheet').classList.add('on');}
function closeSheet(){$('#sheet').classList.remove('on');}
function selCao(id,sel,allowBoth){return`<select id="${id}">${allowBoth?`<option value="" ${sel==null?'selected':''}>Os dois</option>`:''}${CAES.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${c.nome}</option>`).join('')}</select>`;}
function selTipo(id,list,sel){return`<select id="${id}">${list.map(t=>`<option value="${t}" ${sel===t?'selected':''}>${TIPOS[t].n}</option>`).join('')}</select>`;}
function fabAction(){if(atual==='cart')editRot(null);else if(atual==='docs')pickDocs();else if(atual==='ficha')sheetProd(null);else if(atual==='vet')editEv(null,{tipo:'consulta'});else editEv(null);}
const val=id=>($('#'+id)?$('#'+id).value.trim():'');const num=id=>{const v=val(id).replace(',','.');return v===''?null:+v;};

// --- evento ---
const TIT_SUG={peso:'Pesagem',banho:'Banho',tosa:'Tosa',consulta:'Consulta',exame:'Exame',vacina:'Vacina',vermifugo:'Vermífugo',antipulga:'Antipulgas',medicacao:'Medicação',cirurgia:'Cirurgia',outro:'Registro'};
const titSug=t=>TIT_SUG[t]||(TIPOS[t]||TIPOS.outro).n;
function linhas(hs){let h='',b=[];
  for(const x of hs){if(!x)continue;
    if(x.full){if(b.length){h+=b.length>1?`<div class="row2">${b.join('')}</div>`:b[0];b=[];}h+=x.h;continue;}
    b.push(x.h);if(b.length===2){h+=`<div class="row2">${b.join('')}</div>`;b=[];}}
  if(b.length)h+=b.length>1?`<div class="row2">${b.join('')}</div>`:b[0];return h;}
function anexoUI(e,doc){if(!e||!e.id)return'';
  if(doc)return`<div class="t-mut" style="margin:-2px 0 12px;line-height:1.7"><i class="ti ti-file-text" style="color:var(--azul)"></i> ${esc(doc.nome||doc.path.split('/').pop())}<br><button class="lnk" onclick="abrirDoc('${esc(doc.path)}')">abrir</button> · <button class="lnk" onclick="anexarEv(${e.id})">trocar anexo</button> · <button class="lnk" style="color:var(--rosa)" onclick="removerAnexo(${e.id})">remover anexo</button></div>`;
  return`<div class="anexo" onclick="anexarEv(${e.id})"><i class="ti ti-paperclip"></i> Anexar foto ou PDF</div>`;}
function editEv(id,preset,mais){
  const base=id?EV.find(x=>x.id===id):{cao_id:cao,tipo:'vacina',data:hojeISO(),status:'realizado',confirmado:true};
  if(!base)return;
  const e=Object.assign({},base,preset||{});
  const tipo=TIPOS[e.tipo]?e.tipo:'vacina',st=e.status||'realizado',doc=docById(e.documento_id),sug=titSug(tipo);
  const F={hora:{h:`<div class="field"><label>Hora</label><input type="time" id="eH" value="${hBR(e.hora)}"></div>`},
    produto:{h:`<div class="field"><label>Produto</label><input id="ePr" value="${esc(e.produto)}"></div>`},
    lote:{h:`<div class="field"><label>Lote</label><input id="eL" value="${esc(e.lote)}"></div>`},
    vet:{h:`<div class="field"><label>Veterinário</label><input id="eV" value="${esc(e.veterinario)}"></div>`},
    clinica:{h:`<div class="field"><label>Clínica</label><input id="eCl" value="${esc(e.clinica)}"></div>`},
    peso:{h:`<div class="field"><label>Peso (kg)</label><input type="number" step="0.01" inputmode="decimal" id="eK" value="${e.peso_kg||''}"></div>`},
    valor:{h:`<div class="field"><label>Valor (R$)</label><input type="number" step="0.01" inputmode="decimal" id="eR" value="${e.valor||''}"></div>`},
    prox:{h:`<div class="field"><label>Próxima (se houver)</label><input type="date" id="eP" value="${e.proxima_data||''}"></div>`},
    obs:{full:1,h:`<div class="field"><label>Observação</label><textarea id="eO" rows="3">${esc(e.observacao)}</textarea></div>`}};
  const pri=[];
  if(st==='agendado')pri.push('hora');
  if(tipo==='peso')pri.push('peso');
  if(tipo==='vacina')pri.push('produto','lote');
  if(['banho','tosa','consulta','exame','cirurgia'].includes(tipo))pri.push('valor');
  const ordem=['hora','produto','lote','vet','clinica','peso','valor','prox','obs'];
  const ext=ordem.filter(k=>pri.indexOf(k)<0);
  const val_={hora:hBR(e.hora),produto:e.produto,lote:e.lote,vet:e.veterinario,clinica:e.clinica,peso:e.peso_kg,valor:e.valor,prox:e.proxima_data,obs:e.observacao};
  const ab=(mais===undefined)?ext.some(k=>!!val_[k]):!!mais;
  openSheet(`<h3>${id?'Editar registro':'Novo registro'}</h3>
  <div class="row2"><div class="field"><label>Cão</label>${selCao('eC',e.cao_id)}</div><div class="field"><label>Tipo</label><select id="eT" onchange="evRefresh(${id||'null'})">${TIPOS_EV.map(t=>`<option value="${t}" ${tipo===t?'selected':''}>${TIPOS[t].n}</option>`).join('')}</select></div></div>
  <div class="row2"><div class="field"><label>Situação</label><select id="eS" onchange="evRefresh(${id||'null'})"><option value="realizado" ${st==='realizado'?'selected':''}>Aconteceu</option><option value="agendado" ${st==='agendado'?'selected':''}>Agendado</option><option value="cancelado" ${st==='cancelado'?'selected':''}>Cancelado</option></select></div><div class="field"><label>Data</label><input type="date" id="eD" value="${e.data||''}"></div></div>
  <div class="field"><label>Título</label><input id="eTi" data-sug="${esc(sug)}" value="${esc(e.titulo||sug)}" placeholder="${esc(sug)}"></div>
  ${linhas(pri.map(k=>F[k]))}
  <div class="mais" onclick="evMais()"><i class="ti ti-chevron-${ab?'up':'down'}" id="eMaisIc"></i><span id="eMaisTx">${ab?'Menos detalhes':'Mais detalhes'}</span></div>
  <div id="eMais" style="display:${ab?'block':'none'}">${linhas(ext.map(k=>F[k]))}</div>
  ${id?anexoUI(e,doc):''}
  <button class="btn btn-p" onclick="saveEv(${id||'null'})">Salvar</button>
  ${id?`<div style="display:flex;gap:8px;margin-top:8px">${e.confirmado?'':`<button class="btn" onclick="confirmar(${id});closeSheet()">Confirmar</button>`}<button class="btn btn-danger" onclick="delEv(${id})">Apagar</button></div>${e.pagina_origem?`<div class="t-mut" style="margin-top:10px">Origem: ${esc(e.origem)} · ${esc(e.pagina_origem)}${e.confianca?' · confiança '+e.confianca:''}</div>`:''}`:''}`);}
function evMais(){const d=$('#eMais');if(!d)return;const on=d.style.display==='none';d.style.display=on?'block':'none';$('#eMaisTx').textContent=on?'Menos detalhes':'Mais detalhes';$('#eMaisIc').className='ti ti-chevron-'+(on?'up':'down');}
function evForm(){const t=$('#eTi'),sug=t?t.dataset.sug:'';let tit=val('eTi');if(tit===sug)tit='';
  return{cao_id:+val('eC'),tipo:val('eT'),status:val('eS'),hora:val('eH')||null,data:val('eD'),proxima_data:val('eP')||null,titulo:tit,produto:val('ePr')||null,lote:val('eL')||null,veterinario:val('eV')||null,clinica:val('eCl')||null,peso_kg:num('eK'),valor:num('eR'),observacao:val('eO')||null};}
function evRefresh(id){const d=$('#eMais');editEv(id,evForm(),!!(d&&d.style.display!=='none'));}
async function saveEv(id){const t=val('eTi');if(!t||!val('eD')){toast('Título e data são obrigatórios');return;}
  const row={cao_id:+val('eC'),tipo:val('eT'),status:val('eS')||'realizado',hora:val('eH')||null,data:val('eD'),proxima_data:val('eP')||null,titulo:t,produto:val('ePr')||null,lote:val('eL')||null,veterinario:val('eV')||null,clinica:val('eCl')||null,peso_kg:num('eK'),valor:num('eR'),observacao:val('eO')||null};
  closeSheet();
  if(id){const r=await sb.from('pet_eventos').update(row).eq('id',id).select().single();if(r.data)Object.assign(EV.find(x=>x.id===id),r.data);}
  else{row.origem='manual';row.confirmado=true;row.criado_por=autor;const r=await sb.from('pet_eventos').insert(row).select().single();if(r.data)EV.unshift(r.data);EV.sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id);}
  await syncRotina(row);render(atual);toast('Salvo');}
async function syncRotina(ev){if(ev.status==='cancelado')return;const rs=ROT.filter(r=>r.tipo===ev.tipo&&(r.cao_id===ev.cao_id||r.cao_id==null)&&r.ativo);if(!rs.length)return;
  let r=null;if(ev.tipo==='vacina'){const f=famDe(ev);r=f?rs.find(x=>f.re.test((x.titulo||'')+' '+(x.produto||''))):null;}
  if(!r)r=rs.find(x=>x.produto&&ev.produto&&x.produto.toLowerCase()===ev.produto.toLowerCase())||(rs.length===1?rs[0]:null);if(!r)return;
  if(ev.status==='agendado'||ev.data>hojeISO()){const upd={proxima_data:ev.data};Object.assign(r,upd);await sb.from('pet_rotinas').update(upd).eq('id',r.id);return;}
  if(r.ultima_data&&r.ultima_data>ev.data)return;
  const upd={ultima_data:ev.data,proxima_data:ev.proxima_data||addDays(ev.data,r.intervalo_dias)};Object.assign(r,upd);await sb.from('pet_rotinas').update(upd).eq('id',r.id);}
async function confirmar(id){const e=EV.find(x=>x.id===id);if(!e)return;e.confirmado=true;render(atual);await sb.from('pet_eventos').update({confirmado:true}).eq('id',id);toast('Confirmado');}
async function aconteceu(id){const e=EV.find(x=>x.id===id);if(!e)return;if(!confirm(`Confirmar que "${e.titulo}" aconteceu em ${dBR(e.data)}?`))return;e.status='realizado';e.confirmado=true;await sb.from('pet_eventos').update({status:'realizado',confirmado:true}).eq('id',id);await syncRotina(e);render(atual);toast('Registrado como realizado');}
async function confirmarTodos(){const l=EV.filter(e=>!e.confirmado&&e.cao_id===cao);if(!l.length||!confirm(`Confirmar os ${l.length} registros de ${caoAtual().nome}?`))return;l.forEach(e=>e.confirmado=true);render(atual);await sb.from('pet_eventos').update({confirmado:true}).in('id',l.map(e=>e.id));toast('Confirmados');}
async function delEv(id){if(!confirm('Apagar este registro?'))return;await sb.from('pet_eventos').delete().eq('id',id);EV=EV.filter(x=>x.id!==id);closeSheet();render(atual);}

// --- rotina ---
function editRot(id,tipo,preset,mais){
  const base=id?ROT.find(x=>x.id===id):{cao_id:cao,tipo:tipo||'vacina',intervalo_dias:{antipulga:30,vermifugo:90,banho:15,tosa:60}[tipo]||365,ativo:true};
  if(!base)return;
  const r=Object.assign({},base,preset||{});
  const t=TIPOS_ROT.indexOf(r.tipo)>=0?r.tipo:'outro',sug=titSug(t);
  const ab=(mais===undefined)?!!(r.produto||r.ultima_data||r.observacao||r.ativo===false):!!mais;
  openSheet(`<h3>${id?'Editar rotina':'Nova rotina'}</h3>
  <div class="row2"><div class="field"><label>Cão</label>${selCao('rC',r.cao_id,true)}</div><div class="field"><label>Tipo</label>${selTipo('rT',TIPOS_ROT,t)}</div></div>
  <div class="field"><label>Título</label><input id="rTi" value="${esc(r.titulo)}" placeholder="Ex.: ${esc(sug)} mensal"></div>
  <div class="row2"><div class="field"><label>A cada (dias)</label><input type="number" inputmode="numeric" id="rI" value="${r.intervalo_dias||''}"></div><div class="field"><label>Próxima</label><input type="date" id="rN" value="${r.proxima_data||''}"></div></div>
  <div class="mais" onclick="rotMais()"><i class="ti ti-chevron-${ab?'up':'down'}" id="rMaisIc"></i><span id="rMaisTx">${ab?'Menos detalhes':'Mais detalhes'}</span></div>
  <div id="rMais" style="display:${ab?'block':'none'}">
    <div class="row2"><div class="field"><label>Produto</label><input id="rP" value="${esc(r.produto)}"></div><div class="field"><label>Última vez</label><input type="date" id="rU" value="${r.ultima_data||''}"></div></div>
    <div class="field"><label>Observação</label><textarea id="rO" rows="2">${esc(r.observacao)}</textarea></div>
    <div class="field"><label><input type="checkbox" id="rA" ${r.ativo===false?'':'checked'} style="width:auto;margin-right:8px">Ativa (gera lembretes)</label></div></div>
  <button class="btn btn-p" onclick="saveRot(${id||'null'})">Salvar</button>${id?`<button class="btn btn-danger" style="margin-top:8px" onclick="delRot(${id})">Apagar rotina</button>`:''}`);}
function rotMais(){const d=$('#rMais');if(!d)return;const on=d.style.display==='none';d.style.display=on?'block':'none';$('#rMaisTx').textContent=on?'Menos detalhes':'Mais detalhes';$('#rMaisIc').className='ti ti-chevron-'+(on?'up':'down');}
async function saveRot(id){const t=val('rTi'),i=+val('rI');if(!t||!i){toast('Título e intervalo são obrigatórios');return;}
  let prox=val('rN')||null;const ult=val('rU')||null;if(!prox&&ult)prox=addDays(ult,i);
  const row={cao_id:val('rC')?+val('rC'):null,tipo:val('rT'),titulo:t,produto:val('rP')||null,intervalo_dias:i,ultima_data:ult,proxima_data:prox,observacao:val('rO')||null,ativo:$('#rA').checked};closeSheet();
  if(id){const r=await sb.from('pet_rotinas').update(row).eq('id',id).select().single();if(r.data)Object.assign(ROT.find(x=>x.id===id),r.data);}
  else{row.ordem=50;const r=await sb.from('pet_rotinas').insert(row).select().single();if(r.data)ROT.push(r.data);}
  render(atual);toast('Salvo');}
async function delRot(id){if(!confirm('Apagar esta rotina?'))return;await sb.from('pet_rotinas').delete().eq('id',id);ROT=ROT.filter(x=>x.id!==id);closeSheet();render(atual);}
function sheetFeito(id){const r=ROT.find(x=>x.id===id);
  openSheet(`<h3>${esc(r.titulo)} — feito</h3>
  ${r.cao_id?'':`<div class="field"><label>Para</label>${CAES.map(c=>`<label style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:15px"><input type="checkbox" class="fC" value="${c.id}" ${c.id===cao?'checked':''} style="width:auto">${c.nome}</label>`).join('')}</div>`}
  <div class="row2"><div class="field"><label>Data</label><input type="date" id="fD" value="${hojeISO()}"></div><div class="field"><label>Valor (R$)</label><input type="number" step="0.01" inputmode="decimal" id="fR"></div></div>
  <div class="row2"><div class="field"><label>Produto</label><input id="fP" value="${esc(r.produto)}"></div><div class="field"><label>Lote</label><input id="fL"></div></div>
  ${['vacina','consulta','exame'].includes(r.tipo)?`<div class="row2"><div class="field"><label>Veterinário</label><input id="fV"></div><div class="field"><label>Peso (kg)</label><input type="number" step="0.01" inputmode="decimal" id="fK"></div></div>`:''}
  <div class="field"><label>Observação</label><input id="fO"></div>
  <div class="t-mut" style="margin-bottom:12px">Próxima ficará em <b>${dBR(addDays(hojeISO(),r.intervalo_dias))}</b> (a cada ${r.intervalo_dias} dias).</div>
  <button class="btn btn-p" onclick="saveFeito(${id})">Registrar</button>`);}
async function saveFeito(id){const r=ROT.find(x=>x.id===id);const d=val('fD')||hojeISO();const ids=r.cao_id?[r.cao_id]:[...document.querySelectorAll('.fC:checked')].map(x=>+x.value);if(!ids.length){toast('Escolha o cão');return;}closeSheet();
  const prox=addDays(d,r.intervalo_dias);const rows=ids.map(c=>({cao_id:c,tipo:r.tipo==='higiene'?'outro':r.tipo,data:d,titulo:r.titulo,produto:val('fP')||null,lote:val('fL')||null,veterinario:val('fV')||null,peso_kg:num('fK'),valor:num('fR'),proxima_data:prox,observacao:val('fO')||null,origem:'manual',confirmado:true,criado_por:autor}));
  const ins=await sb.from('pet_eventos').insert(rows).select();if(ins.data){EV=ins.data.concat(EV);}
  const upd={ultima_data:d,proxima_data:prox};Object.assign(r,upd);await sb.from('pet_rotinas').update(upd).eq('id',id);render(atual);toast('Registrado · próxima '+dBR(prox));}

// --- produto ---

  openSheet(`<h3>${id?'Editar produto':'Novo produto'}</h3>
  <div class="row2"><div class="field"><label>Cão</label>${selCao('pC',p.cao_id,true)}</div><div class="field"><label>Categoria</label><select id="pK">${Object.entries(CATP).map(([k,n])=>`<option value="${k}" ${p.categoria===k?'selected':''}>${n}</option>`).join('')}</select></div></div>
  <div class="field"><label>Nome</label><input id="pN" value="${esc(p.nome)}" placeholder="Ex.: Ração Premier Raças Pequenas"></div>
  <div class="row2"><div class="field"><label>Marca</label><input id="pM" value="${esc(p.marca)}"></div><div class="field"><label>Apresentação</label><input id="pA" value="${esc(p.apresentacao)}" placeholder="10,1 kg / 1 cp / 1 ml"></div></div>
  <div class="row2"><div class="field"><label>Dose / quantidade</label><input id="pD" value="${esc(p.dose)}" placeholder="80 g/dia"></div><div class="field"><label>Frequência</label><input id="pF" value="${esc(p.frequencia)}" placeholder="2x/dia · mensal"></div></div>
  <div class="row2"><div class="field"><label>Valor (R$)</label><input type="number" step="0.01" inputmode="decimal" id="pV" value="${p.valor||''}"></div><div class="field"><label>Onde compra</label><input id="pW" value="${esc(p.onde_compra)}"></div></div>
  <div class="field"><label>Observação</label><input id="pO" value="${esc(p.observacao)}"></div>

function shrink(file){return new Promise(res=>{const img=new Image();img.onerror=()=>res(file);img.onload=()=>{const M=1800,sc=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.82);};img.src=URL.createObjectURL(file);});}
async function uploadDoc(file){const pdf=file.type==='application/pdf';const blob=pdf?file:await shrink(file);const path='inbox/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+(pdf?'.pdf':'.jpg');

  }else{row.enviado_por=autor;

function falarHTML(texto){return`<h3>Falar ou escrever</h3><div id="flOuv"></div>
  <div class="field"><textarea id="flTxt" rows="4" oninput="pararRec(true)" placeholder="Ex.: dei antipulgas Simparic no Jorge hoje, 60 reais · a Stout pesou 5,8 kg · remarca a consulta para quinta">${esc(texto)}</textarea></div>
  <div class="t-mut" style="margin-bottom:10px">Cão selecionado: <b>${esc((caoAtual()||{}).nome||'')}</b> (se não citar o nome, uso este).</div>
  <div id="flBtns"></div><div class="err" id="flErr" style="color:var(--rosa);font-size:13px;margin-top:10px"></div>`;}
function recUI(){const o=$('#flOuv'),b=$('#flBtns');if(!o||!b)return;
  if(REC.ativo){o.innerHTML='<div class="ouv"><span class="pulso"></span>Ouvindo… pode falar</div>';
    b.innerHTML='<button class="btn" style="margin-bottom:8px" onclick="pararRec()"><i class="ti ti-player-stop"></i> Parar</button><button class="btn btn-p" id="flBtn" onclick="interpretar()">Interpretar</button>';}
  else{const dica=REC.erro?'Não consegui usar o microfone aqui — escreva, ou toque no microfone do teclado para ditar.':(SR?'Toque em Gravar para ditar, ou escreva. Você pode editar o texto antes de interpretar.':'Escreva como falaria — no iPhone, toque no microfone do teclado para ditar.');
    o.innerHTML=`<div class="t-mut" style="margin:-8px 0 12px">${dica} Eu interpreto e você só confere.</div>`;

function startRec(){if(!SR){recUI();return;}
  try{if(REC.obj){try{REC.obj.abort();}catch(_){}}
    const r=new SR();REC={obj:r,ativo:false,final:(val('flTxt')||''),manual:false,erro:''};
    r.lang='pt-BR';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    r.onstart=()=>{REC.ativo=true;recUI();};
    r.onresult=ev=>{let fin='',int='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){const x=ev.results[i];if(x.isFinal)fin+=x[0].transcript;else int+=x[0].transcript;}
      if(fin)REC.final=(REC.final+' '+fin).trim();
      const ta=$('#flTxt');if(ta)ta.value=(REC.final+' '+int).trim();};
    r.onerror=ev=>{REC.erro=(ev&&ev.error)||'erro';};
    r.onend=()=>{const fin=REC.final;REC.ativo=false;REC.obj=null;recUI();
      const ta=$('#flTxt');if(!ta)return;
      if(fin&&!ta.value.trim())ta.value=fin;
      setTimeout(()=>{try{ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}catch(_){}},60);};
    r.start();
  }catch(e){REC.ativo=false;REC.erro='falhou';recUI();}}
function pararRec(silencioso){if(REC.obj){REC.manual=true;try{REC.obj.stop();}catch(_){try{REC.obj.abort();}catch(__){}}}
  if(silencioso&&REC.ativo){REC.ativo=false;recUI();}}

  await chamarParse(t);}
function pensando(){openSheet(`<h3>Pensando…</h3><div class="t-mut" style="margin:-8px 0 12px">Um instante — estou olhando as rotinas e os registros.</div><div class="ouv"><span class="pulso"></span>Interpretando</div>`);}
async function msgErroInvoke(error){try{const c=error&&error.context;if(c){const r=(typeof c.clone==='function')?c.clone():c;let j=null;try{j=await r.json();}catch(_){try{const t=await r.text();j=JSON.parse(t);}catch(__){}}
  const m=j&&(j.erro||j.error||j.message);if(m)return String(m);}}catch(_){}
  return (error&&error.message)||'Não consegui interpretar';}
async function chamarParse(texto){if(!ENTRADA)ENTRADA={historico:[],acoes:[],perg:[]};
  pensando();

    if(error)throw new Error(await msgErroInvoke(error));if(!data)throw new Error('sem resposta');if(data.erro)throw new Error(data.erro);
    ENTRADA.historico=(ENTRADA.historico||[]).concat([{role:'user',content:texto},{role:'assistant',content:JSON.stringify(data)}]).slice(-20);

    openSheet(`<h3>Não consegui interpretar</h3><div class="t-mut" style="margin:-8px 0 14px">${esc((e&&e.message)||e)}</div>

    et=esc(e.titulo)+` <span class="tag b">${esc(nomeCao(e.cao_id))}</span>`;
    es=`${e.status==='agendado'?'agendado · ':''}${dBR(e.data)}${e.hora?' '+hBR(e.hora):''}${e.produto?' · '+esc(e.produto):''}${e.valor?' · '+money(e.valor):''}${e.peso_kg?' · '+e.peso_kg+' kg':''}${e.proxima_data?' · próxima '+dBR(e.proxima_data):''}`;}
  else if(a.tipo==='evento_atualizar'){const o=EV.find(x=>x.id===a.id)||{};const T=TIPOS[o.tipo]||TIPOS.outro;ic=T.ic;cor=T.c;pre='Atualizar';
    et=esc(o.titulo||'registro')+(o.data?` <span class="tag b">${dBR(o.data)}</span>`:'');
    es=descCampos(camposEv(a.campos));}
  else if(a.tipo==='rotina_nova'){const r=rotRow(a.rotina);const T=TIPOS[r.tipo]||TIPOS.outro;ic=T.ic;cor=T.c;pre='Nova rotina';
    et=esc(r.titulo)+` <span class="tag b">${r.cao_id?esc(nomeCao(r.cao_id)):'os dois'}</span>`;
    es='a cada '+r.intervalo_dias+' dias'+(r.produto?' · '+esc(r.produto):'')+(r.proxima_data?' · próxima '+dBR(r.proxima_data):'');}
  else if(a.tipo==='rotina_atualizar'){const o=ROT.find(x=>x.id===a.id)||{};const T=TIPOS[o.tipo]||TIPOS.outro;ic=T.ic;cor=T.c;pre='Atualizar rotina';
    et=esc(o.titulo||'rotina');es=descCampos(camposRot(a.campos));}
  else if(a.tipo==='produto_novo'){const p=prodRowIA(a.produto);ic='ti-package';cor='var(--ink2)';pre='Novo produto';
    et=esc(p.nome)+` <span class="tag b">${p.cao_id?esc(nomeCao(p.cao_id)):'os dois'}</span>`;
    es=[CATP[p.categoria],p.marca,p.dose,p.frequencia].filter(Boolean).map(esc).join(' · ');}
  else if(a.tipo==='produto_atualizar'){const o=PROD.find(x=>x.id===a.id)||{};ic='ti-package';pre='Atualizar produto';
    et=esc(o.nome||'produto');es=descCampos(camposProd(a.campos));}
  else return'';
  return`<div class="ent" onclick="abrirAcao(${i})"><i class="ti ${ic}" style="color:${cor};font-size:20px;margin-top:2px"></i>
    <div style="flex:1;min-width:0"><div class="es" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600">${pre}</div>
    <div class="et">${et}</div><div class="es">${es}</div></div><i class="ti ti-pencil" style="color:var(--ink3)"></i></div>`;}
function abrirAcao(i){const a=(ENTRADA&&ENTRADA.acoes||[])[i];if(!a)return;
  if(a.tipo==='evento_novo')return editEv(null,entradaEv(a.evento));
  if(a.tipo==='evento_atualizar')return editEv(a.id,camposEv(a.campos));
  if(a.tipo==='rotina_nova'){const r=rotRow(a.rotina);return editRot(null,r.tipo,r);}
  if(a.tipo==='rotina_atualizar')return editRot(a.id,null,camposRot(a.campos));
  if(a.tipo==='produto_novo')return sheetProd(null,prodRowIA(a.produto));
  if(a.tipo==='produto_atualizar')return sheetProd(a.id,camposProd(a.campos));}
function mostrarEntrada(texto,res){if(!ENTRADA)ENTRADA={historico:[]};
  ENTRADA.res=res;ENTRADA.ultimo=texto;res=res||{};
  const perg=(res.perguntas||[]).filter(q=>q&&q.texto);
  if(perg.length&&res.pronto!==true)return sheetPerguntas(res,perg);
  const acoes=(res.acoes||[]).filter(a=>a&&a.tipo);ENTRADA.acoes=acoes;
  const linhasA=acoes.map((a,i)=>acaoLinha(a,i)).join('');
  openSheet(`<h3>Entendi assim</h3>${res.resumo?`<div class="t-mut" style="margin:-8px 0 12px">${esc(res.resumo)}</div>`:''}
    ${linhasA}
    ${acoes.length?`<button class="btn btn-p" style="margin-top:14px" onclick="salvarEntrada()">Salvar${acoes.length>1?' tudo ('+acoes.length+')':''}</button>`:'<div class="empty">Nada para registrar.</div>'}
    <button class="btn" style="margin-top:8px" onclick="sheetFalar(ENTRADA&&ENTRADA.ultimo)">Reescrever</button>`);}
function sheetPerguntas(res,perg){const qs=perg.slice(0,2);ENTRADA.perg=qs;
  openSheet(`<h3>Me ajuda com isso</h3>${res.resumo?`<div class="t-mut" style="margin:-8px 0 12px">${esc(res.resumo)}</div>`:''}
    ${qs.map((q,i)=>`<div class="perg"><div class="pq">${esc(q.texto)}</div>
      ${(q.opcoes||[]).length?`<div class="chips">${q.opcoes.map(o=>`<span class="chip" onclick="chip(this,${i})">${esc(o)}</span>`).join('')}</div>`:''}
      <input id="rq${i}" placeholder="ou escreva a resposta"></div>`).join('')}
    <button class="btn btn-p" style="margin-top:4px" onclick="responder()">Responder</button>
    <button class="btn" style="margin-top:8px" onclick="sheetFalar(ENTRADA&&ENTRADA.ultimo)">Reescrever</button>`);}
function chip(el,i){const inp=$('#rq'+i);if(inp)inp.value=(el.textContent||'').trim();
  const box=el.parentNode;if(box)[].forEach.call(box.children,c=>c.classList.remove('on'));
  el.classList.add('on');
  if(((ENTRADA&&ENTRADA.perg)||[]).length===1)setTimeout(responder,140);}
function responder(){const qs=(ENTRADA&&ENTRADA.perg)||[],partes=[];
  qs.forEach((q,i)=>{const v=val('rq'+i);if(v)partes.push(q.texto+' -> '+v);});
  if(!partes.length){toast('Escolha ou escreva uma resposta');return;}
  chamarParse(partes.join('\n'));}
async function salvarEntrada(){const acoes=(ENTRADA&&ENTRADA.acoes)||[];if(!acoes.length)return;closeSheet();
  let n=0,falhas=0;
  for(const a of acoes){
    try{
      if(a.tipo==='evento_novo'){
        const row=Object.assign(entradaEv(a.evento),{origem:'ia',confirmado:true,criado_por:autor+' (voz/texto)'});
        const r=await sb.from('pet_eventos').insert(row).select().single();if(r.error)throw r.error;
        EV.unshift(r.data);await syncRotina(r.data);n++;
      }else if(a.tipo==='evento_atualizar'){
        const c=camposEv(a.campos);if(!a.id||!Object.keys(c).length)continue;
        const r=await sb.from('pet_eventos').update(c).eq('id',a.id).select().single();if(r.error)throw r.error;
        const x=EV.find(e=>e.id===a.id);if(x)Object.assign(x,r.data);else EV.unshift(r.data);
        await syncRotina(r.data);n++;
      }else if(a.tipo==='rotina_nova'){
        const r=await sb.from('pet_rotinas').insert(Object.assign(rotRow(a.rotina),{ordem:50})).select().single();if(r.error)throw r.error;
        ROT.push(r.data);n++;
      }else if(a.tipo==='rotina_atualizar'){
        const c=camposRot(a.campos);if(!a.id||!Object.keys(c).length)continue;
        const r=await sb.from('pet_rotinas').update(c).eq('id',a.id).select().single();if(r.error)throw r.error;
        const x=ROT.find(e=>e.id===a.id);if(x)Object.assign(x,r.data);else ROT.push(r.data);n++;
      }else if(a.tipo==='produto_novo'){
        const r=await sb.from('pet_produtos').insert(prodRowIA(a.produto)).select().single();if(r.error)throw r.error;
        PROD.push(r.data);n++;
      }else if(a.tipo==='produto_atualizar'){
        const c=camposProd(a.campos);if(!a.id||!Object.keys(c).length)continue;
        const r=await sb.from('pet_produtos').update(c).eq('id',a.id).select().single();if(r.error)throw r.error;
        const x=PROD.find(e=>e.id===a.id);if(x)Object.assign(x,r.data);n++;
      }
    }catch(err){falhas++;}
  }
  EV.sort((x,y)=>y.data.localeCompare(x.data)||y.id-x.id);
  try{const u=await sb.from('pet_entradas').select('id').order('id',{ascending:false}).limit(1).single();
    if(u.data)await sb.from('pet_entradas').update({aplicado:true}).eq('id',u.data.id);}catch(_){}
  render(atual);toast(falhas?(n+' salvo(s), '+falhas+' com erro'):(n===1?'Registrado':n+' registros salvos'));}
async function refreshApp(){if($('#login').classList.contains('on'))return;const b=$('#btnRefresh');b.classList.add('spin');const t0=Date.now();try{await loadAll();render(atual);}catch(e){}setTimeout(()=>b.classList.remove('spin'),Math.max(0,500-(Date.now()-t0)));}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(()=>pushCheck()).catch(()=>{PUSH.pronto=true;});}else{PUSH.pronto=true;}
boot();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshApp();});
</script>
</body>
